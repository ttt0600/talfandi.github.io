<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7a171b">
<title>أركانات | التحضير التشغيلي</title>
<link rel="stylesheet" href="./print-ui.css?v=20260917-2">
</head>
<body>
<iframe id="appFrame" src="./app-core.html" title="أركانات - التحضير التشغيلي"></iframe>
<div id="printShell" class="print-shell" aria-hidden="true">
  <div class="print-toolbar">
    <div class="print-toolbar-in">
      <div class="field">
        <label for="pPeriod">دورة التحضير</label>
        <input id="pPeriod" type="month">
      </div>

      <div class="field smart-search">
        <label for="pSearch">بحث سريع</label>
        <span class="search-icon">⌕</span>
        <input id="pSearch" type="search" autocomplete="off" placeholder="اكتب اسم العميل أو المشروع أو الموقع أو الكود">
        <div id="pSearchResults" class="search-results" role="listbox"></div>
      </div>

      <div class="field">
        <label for="pClient">العميل</label>
        <select id="pClient"><option value="">جاري تحميل العملاء...</option></select>
      </div>

      <div class="field">
        <label for="pProject">المشروع</label>
        <select id="pProject" disabled><option value="">اختاري العميل أولاً</option></select>
      </div>

      <div class="field">
        <label for="pSite">الموقع</label>
        <select id="pSite" disabled><option value="">اختاري المشروع أولاً</option></select>
      </div>

      <div class="toolbar-actions">
        <button id="pReload" class="tb-btn tb-ghost" type="button">تحديث</button>
        <button id="pPrint" class="tb-btn tb-primary" type="button" disabled>طباعة / PDF</button>
        <button id="pClose" class="tb-btn tb-gold" type="button">العودة</button>
      </div>

      <div class="selection-summary" aria-live="polite">
        <div id="pCrumbs">ابدئي بالبحث السريع أو اختاري العميل ثم المشروع ثم الموقع.</div>
        <button id="pClear" class="clear" type="button">مسح الاختيار</button>
        <span id="pCount" class="count"></span>
      </div>
    </div>
  </div>

  <div id="pNotice" class="notice" style="display:none"></div>
  <div class="print-stage" id="sheet">
    <div class="sheet-empty"><div><b>اختاري الموقع المطلوب</b><div style="margin-top:7px">استخدمي البحث السريع أو التدرج: عميل ← مشروع ← موقع.</div></div></div>
  </div>
</div>
<script src="./print-ui.js?v=20260917-2" defer></script>
<script src="./selector-fix.js?v=20260917-2" defer></script>
</body>
</html>
