<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7a171b">
<title>أركانات | التحضير التشغيلي</title>
<style>
:root{--maroon:#7a171b;--red:#9b1b20;--gold:#af971c;--ink:#211c1c;--muted:#6f6a67;--paper:#fff;--warm:#faf9f5;--line:#d8d3c7;--green:#1f6a4d;--danger:#9f3030}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;background:#f2f3f3;color:var(--ink)}
#appFrame{position:fixed;inset:0;width:100%;height:100dvh;border:0;background:#f2f3f3}
.print-shell{position:fixed;inset:0;z-index:9999;background:#e9ecec;display:none;overflow:auto}.print-shell.open{display:block}
.print-toolbar{position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid #d9dddd;box-shadow:0 4px 16px rgba(0,0,0,.08)}
.print-toolbar-in{max-width:1480px;margin:auto;padding:10px 14px;display:flex;align-items:end;gap:9px;flex-wrap:wrap}.print-toolbar .field{display:flex;flex-direction:column;gap:5px;min-width:175px;flex:1}.print-toolbar label{font-size:11px;font-weight:800;color:#625d59}.print-toolbar input,.print-toolbar select{width:100%;min-height:42px;border:1px solid #c8c5be;border-radius:9px;padding:9px 10px;background:#fff;font:inherit;outline:none}.print-toolbar input:focus,.print-toolbar select:focus{border-color:var(--maroon);box-shadow:0 0 0 3px rgba(122,23,27,.10)}
.tb-btn{min-height:42px;border-radius:9px;padding:9px 14px;font-weight:900;cursor:pointer;border:1px solid transparent}.tb-primary{background:var(--maroon);color:#fff;border-color:var(--maroon)}.tb-primary:hover{background:#651317}.tb-ghost{background:#fff;color:var(--maroon);border-color:#b9aaa8}.tb-gold{background:#f4edd3;color:#5c4c0f;border-color:#d8c77e}
.notice{max-width:1480px;margin:10px auto 0;padding:10px 12px;border:1px solid #e3cf93;background:#fff8df;border-radius:9px;font-size:12px;line-height:1.6}.print-stage{padding:14px}.sheet-empty{width:min(287mm,100%);min-height:185mm;margin:auto;background:#fff;border:1px solid var(--line);display:grid;place-items:center;text-align:center;color:#77716d}
.print-page{width:287mm;height:200mm;overflow:hidden;margin:0 auto 14px;padding:4mm;background:var(--paper);border:1px solid #d8d0bd;box-shadow:0 10px 34px rgba(0,0,0,.12);display:flex;flex-direction:column;direction:rtl}
.sheet-head{display:grid;grid-template-columns:47mm 1fr 20mm;gap:4mm;align-items:center;min-height:21mm;margin-bottom:2mm;border-bottom:1px solid #dfd7c8;padding-bottom:1.5mm;direction:ltr}
.brand-lockup{direction:rtl;text-align:center;line-height:1.05}.brand-mark{height:2.3mm;width:100%;background:linear-gradient(90deg,var(--maroon) 0 55%,var(--gold) 55% 100%);border-radius:2mm;margin-bottom:1.4mm}.brand-ar{font-size:9.6pt;font-weight:950;color:#171515;white-space:nowrap}.brand-en{font-family:Georgia,"Times New Roman",serif;font-size:4.8pt;font-weight:700;color:#332d2b;letter-spacing:.15px;margin-top:.7mm;white-space:nowrap}.header-center{direction:rtl;text-align:center}.sheet-title{display:inline-block;background:var(--maroon);color:#fff;border-bottom:2px solid var(--gold);border-radius:2mm;padding:1.4mm 6mm;font-size:9.5pt;font-weight:950;line-height:1.25}.meta-strip{display:flex;justify-content:center;gap:1.5mm;flex-wrap:wrap;margin-top:1.8mm;font-size:5.9pt}.meta-strip span{background:#fff;border:1px solid #d5c8a5;border-radius:1.2mm;padding:.65mm 1.5mm;white-space:nowrap}.page-number{direction:rtl;text-align:center;color:#6c625e;font-size:6pt;font-weight:800}.page-number b{display:block;color:var(--maroon);font-size:11pt;line-height:1}
.table-wrap{width:100%;overflow:hidden}.timesheet{width:100%;border-collapse:collapse;table-layout:fixed;border:1px solid #5d514e;background:#fff;font-size:4.8pt}.timesheet th,.timesheet td{border:1px solid #746966;text-align:center;vertical-align:middle;padding:.25mm .12mm;height:4.25mm;line-height:1.05;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.timesheet thead th{background:#332624;color:#fff;font-weight:900}.timesheet .name-cell{text-align:right;padding-right:.8mm;font-weight:800;font-size:5.25pt}.timesheet .missing{background:#fff0ef;color:#9a3333}.timesheet .off{background:#f1f1ef;color:#57504d}.timesheet .cover{background:#fff4d8;color:#665412}.timesheet .abs{background:#fff0f0;color:#912e2e}.timesheet tbody tr:nth-child(even) td:not(.missing):not(.off):not(.cover):not(.abs){background:#fcfbf8}
.page-strip{display:flex;justify-content:space-between;align-items:center;margin-top:1mm;font-size:5.2pt;color:#746e69;min-height:4mm}.page-strip .site{font-weight:800;color:#4b4441}.page-strip .ref{direction:ltr}
.final-block{margin-top:auto;padding-top:1.6mm;border-top:1px solid #ded6c8}.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:1.5mm}.kpi{border:1px solid #c7c1b5;background:#fbfaf7;border-radius:1.2mm;text-align:center;padding:.75mm;min-height:8.5mm}.kpi b{display:block;color:#645c58;font-size:5.3pt;margin-bottom:.25mm}.kpi strong{display:block;color:var(--maroon);font-size:9pt;line-height:1;font-weight:950}.legend{display:flex;gap:1.1mm;flex-wrap:wrap;justify-content:center;margin-top:1.2mm;font-size:5.1pt}.legend span{border:1px solid #bdb7ad;background:#fff;border-radius:1mm;padding:.5mm 1mm;white-space:nowrap}.approvals{display:grid;grid-template-columns:repeat(5,1fr);gap:2.5mm;margin-top:2.2mm;text-align:center;font-size:5.6pt}.approval{min-height:12mm;padding-top:.9mm;border-top:1px solid #c8b773}.approval b{display:block;font-size:6pt;margin-bottom:4.2mm;color:#3a302d}.doc-foot{display:flex;justify-content:space-between;align-items:center;border-top:1px solid #d6c9a8;margin-top:1.5mm;padding-top:.8mm;font-size:4.9pt;color:#756f69}.draft{display:inline-block;border:1px solid #d08b8b;color:#8c2d2d;background:#fff2f2;border-radius:1mm;padding:.5mm 1.2mm;font-size:5pt;font-weight:900;margin-top:1mm}.small-note{font-size:4.7pt;color:#817a75}
@media(max-width:900px){.print-stage{padding:6px}.print-page{min-width:1080px}.print-toolbar-in{align-items:stretch}.print-toolbar .field{min-width:145px}}
@media print{
 @page{size:A4 landscape;margin:5mm}
 html,body{background:#fff!important;height:auto;-webkit-print-color-adjust:exact;print-color-adjust:exact}
 #appFrame,.print-toolbar,.notice{display:none!important}.print-shell{display:block!important;position:static;overflow:visible;background:#fff}.print-stage{padding:0}.print-page{width:287mm;height:200mm;box-shadow:none;border:0;margin:0;padding:3mm;break-after:page}.print-page:last-child{break-after:auto}.sheet-head{min-height:19mm;margin-bottom:1.5mm}.timesheet{font-size:4.65pt}.timesheet th,.timesheet td{height:4.05mm;padding:.18mm .08mm}.final-block{break-inside:avoid}.brand-ar{font-size:9pt}.sheet-title{font-size:9pt}.kpi{min-height:7.8mm}.kpi strong{font-size:8.5pt}
}
</style>
</head>
<body>
<iframe id="appFrame" src="./app-core.html" title="أركانات - التحضير التشغيلي"></iframe>
<div id="printShell" class="print-shell" aria-hidden="true">
 <div class="print-toolbar"><div class="print-toolbar-in">
  <div class="field"><label>شهر التحضير</label><input id="pPeriod" type="month"></div>
  <div class="field" style="flex:2"><label>العميل / المشروع / الموقع</label><select id="pSite"><option value="">جاري تحميل المواقع...</option></select></div>
  <button id="pReload" class="tb-btn tb-ghost">تحديث المعاينة</button>
  <button id="pPrint" class="tb-btn tb-primary">طباعة / حفظ PDF</button>
  <button id="pClose" class="tb-btn tb-gold">العودة للتحضير</button>
 </div></div>
 <div id="pNotice" class="notice" style="display:none"></div>
 <div class="print-stage" id="sheet"><div class="sheet-empty"><div><b>اختاري العميل / المشروع / الموقع</b><div style="margin-top:6px">سيظهر كشف العميل هنا قبل الطباعة.</div></div></div></div>
</div>
<script>
const API='https://dbxvfrkkocfwjumvoaha.supabase.co/functions/v1/arkanat-prep';
const $=id=>document.getElementById(id);
const STATUS_PRINT={P:'P',OFF:'OFF',A:'A',T:'T',AL:'AL',SK:'SK',S:'S',W:'W',R:'R',O:'O',SUB:'C',CASH:'C',OTHER:'-'};
let P={ws:null,groups:[],filename:''};
const defaultTitle='أركانات | التحضير التشغيلي';
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function safeName(s){return String(s||'').replace(/[\\/:*?"<>|]+/g,'-').replace(/\s+/g,' ').trim()}
function riyadhToday(){const x=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Riyadh',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());const o=Object.fromEntries(x.map(i=>[i.type,i.value]));return `${o.year}-${o.month}-${o.day}`}
function daysIn(p){const [y,m]=p.split('-').map(Number);return new Date(y,m,0).getDate()}
function monthName(p){const [y,m]=p.split('-').map(Number);return new Intl.DateTimeFormat('ar-SA-u-ca-gregory',{month:'long',year:'numeric'}).format(new Date(y,m-1,1))}
function cleanDate(x){return String(x||'').slice(0,10)}
async function api(action,payload={}){const token=localStorage.getItem('arkPrepToken')||'';if(!token)throw new Error('سجلي الدخول إلى التحضير أولاً.');const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action,token,...payload})});const d=await r.json();if(!r.ok||d.ok===false)throw new Error(d.message||d.code||'تعذر تحميل البيانات');return d}
function buildGroups(ws){const sites=ws.sites||[],map=new Map();(ws.assignments||[]).forEach(a=>{const code=a.site_code||'__NO_SITE__',s=sites.find(x=>x.site_code===a.site_code)||{};if(!map.has(code))map.set(code,{code,site_name:a.site_name||s.site_name||'بدون موقع',project_name:a.project_name||s.project_name||'',client_name:s.client_name||a.client_name||'',city:s.city||a.city||'',guards:[]});map.get(code).guards.push(a)});return [...map.values()].filter(g=>g.code!=='__NO_SITE__').sort((a,b)=>`${a.client_name} ${a.project_name} ${a.site_name}`.localeCompare(`${b.client_name} ${b.project_name} ${b.site_name}`,'ar'))}
function employeeRef(a){return a.employee_ref||a.national_id_masked||a.identity_last4||'—'}
function dayEntry(a,day,p){const key=`${p}-${String(day).padStart(2,'0')}`;return (a.days||[]).find(d=>cleanDate(d.date)===key)}
function activeOn(a,day,p){const d=`${p}-${String(day).padStart(2,'0')}`,s=a.start_date||`${p}-01`,e=a.end_date||`${p}-${String(daysIn(p)).padStart(2,'0')}`;return d>=s&&d<=e}
function shiftHours(code){const m=String(code||'').match(/(8|12)$/);return m?Number(m[1]):null}
function workHours(a,d){if(!d)return 0;if(d.worked_hours!==null&&d.worked_hours!==undefined&&d.worked_hours!=='')return Number(d.worked_hours)||0;if(['P','SUB','CASH'].includes(d.status))return shiftHours(d.shift_code||a.shift_code)||0;return 0}
function dayClass(st){if(!st)return'missing';if(['A','W','R','S'].includes(st))return'abs';if(['OFF','O','AL','SK'].includes(st))return'off';if(['SUB','CASH'].includes(st))return'cover';return''}
function metrics(g,p){let z={present:0,abs:0,withdraw:0,off:0,coverage:0,missing:0,hours:0};for(const a of g.guards){for(let d=1;d<=daysIn(p);d++){if(!activeOn(a,d,p))continue;const e=dayEntry(a,d,p);if(!e){z.missing++;continue}if(e.status==='P')z.present++;if(e.status==='A')z.abs++;if(e.status==='W')z.withdraw++;if(['OFF','O','AL','SK'].includes(e.status))z.off++;if(['SUB','CASH'].includes(e.status))z.coverage++;z.hours+=workHours(a,e)}}return z}
function guardRow(a,idx,p){let cells='',worked=0,totalHours=0;for(let d=1;d<=daysIn(p);d++){const on=activeOn(a,d,p),e=on?dayEntry(a,d,p):null,st=e?.status||'',code=!on?'':(st?STATUS_PRINT[st]||st:'—');cells+=`<td class="${on?dayClass(st):'off'}">${esc(code)}</td>`;if(e&&['P','SUB','CASH'].includes(st))worked++;totalHours+=workHours(a,e)}return `<tr><td>${idx+1}</td><td class="name-cell">${esc(a.full_name||'')}</td><td>${esc(employeeRef(a))}</td><td>${esc(a.job_title||'حارس أمن')}</td>${cells}<td><b>${worked}</b></td><td><b>${totalHours||''}</b></td></tr>`}
function colgroup(p){let cols='<col style="width:5mm"><col style="width:32mm"><col style="width:18mm"><col style="width:15mm">';for(let i=1;i<=daysIn(p);i++)cols+='<col style="width:4.4mm">';cols+='<col style="width:12mm"><col style="width:14mm">';return `<colgroup>${cols}</colgroup>`}
function tableHead(p){let d='';for(let i=1;i<=daysIn(p);i++)d+=`<th>${i}</th>`;return `<thead><tr><th>م</th><th>اسم الحارس</th><th>الرقم الوظيفي</th><th>المسمى</th>${d}<th>أيام العمل</th><th>الساعات</th></tr></thead>`}
function header(g,p,page,total){const n=daysIn(p),region=P.ws?.region_name||'',label=g.project_name||g.site_name||g.client_name;return `<div class="sheet-head"><div class="brand-lockup"><div class="brand-mark"></div><div class="brand-ar">أركانات للحراسات الأمنية</div><div class="brand-en">ARKANAT for Security Guards</div></div><div class="header-center"><div class="sheet-title">كشف حضور حراس الأمن - ${esc(label)}</div><div class="meta-strip"><span>${esc(region)}${g.city?' - '+esc(g.city):''}</span><span>العميل: ${esc(g.client_name||'—')}</span><span>المشروع: ${esc(g.project_name||'—')}</span><span>${esc(monthName(p))}</span><span>${p}-01 إلى ${p}-${String(n).padStart(2,'0')}</span></div></div><div class="page-number"><b>${page}/${total}</b>صفحة</div></div>`}
function finalBlock(m,g,p){return `<div class="final-block"><div class="kpi-row"><div class="kpi"><b>الحضور</b><strong>${m.present}</strong></div><div class="kpi"><b>الغياب</b><strong>${m.abs}</strong></div><div class="kpi"><b>الانسحاب</b><strong>${m.withdraw}</strong></div><div class="kpi"><b>التغطيات</b><strong>${m.coverage}</strong></div></div><div class="legend"><span><b>P</b> حاضر</span><span><b>A</b> غائب</span><span><b>OFF</b> راحة</span><span><b>T</b> استئذان</span><span><b>AL</b> إجازة سنوية</span><span><b>SK</b> مرضية</span><span><b>W</b> انسحاب</span><span><b>R</b> استقالة</span><span><b>S</b> توقف</span><span><b>C</b> تغطية</span><span><b>إجمالي الساعات</b> ${m.hours}</span></div><div class="approvals"><div class="approval"><b>مسؤول العميل / الموقع</b>الاسم / التوقيع</div><div class="approval"><b>مشرف الأمن</b>الاسم / التوقيع</div><div class="approval"><b>مدير إدارة التشغيل</b>الاسم / التوقيع</div><div class="approval"><b>إدارة العمليات الموحدة</b>الاسم / التوقيع</div><div class="approval"><b>إدارة الموارد البشرية</b>الاسم / التوقيع</div></div><div class="doc-foot"><span>شركة أركانات للحراسات الأمنية</span><span>${esc(g.project_name||g.site_name||'')}</span><span>${esc(p)}</span></div>${m.missing?`<div class="draft">مسودة - يوجد ${m.missing} يوم/سجل غير مكتمل</div>`:''}</div>`}
function renderSheet(){const p=$('pPeriod').value,g=P.groups.find(x=>x.code===$('pSite').value);if(!g){$('sheet').innerHTML='<div class="sheet-empty"><b>اختاري العميل / المشروع / الموقع</b></div>';return}const m=metrics(g,p);const perPage=26,chunks=[];for(let i=0;i<g.guards.length;i+=perPage)chunks.push(g.guards.slice(i,i+perPage));if(!chunks.length)chunks.push([]);$('sheet').innerHTML=chunks.map((chunk,pi)=>`<section class="print-page">${header(g,p,pi+1,chunks.length)}<div class="table-wrap"><table class="timesheet">${colgroup(p)}${tableHead(p)}<tbody>${chunk.map((a,j)=>guardRow(a,pi*perPage+j,p)).join('')}</tbody></table></div><div class="page-strip"><span class="site">${esc(g.site_name||g.project_name||'')}</span><span class="small-note">عدد الحراس في الكشف: ${g.guards.length}</span><span class="ref">${pi+1}/${chunks.length}</span></div>${pi===chunks.length-1?finalBlock(m,g,p):''}</section>`).join('');$('pNotice').style.display=m.missing?'block':'none';$('pNotice').textContent=m.missing?`تنبيه قبل الإرسال: يوجد ${m.missing} يوم/سجل غير مكتمل في هذا الكشف.`:'';P.filename=`أركانات - كشف حضور - ${safeName(g.project_name||g.site_name||g.client_name)} - ${safeName(P.ws?.region_name||'')} - ${safeName(monthName(p))}`}
async function loadData(){try{$('pNotice').style.display='block';$('pNotice').textContent='جاري تحميل بيانات الكشف...';P.ws=await api('workspace',{period:$('pPeriod').value});P.groups=buildGroups(P.ws);const old=$('pSite').value,opts=['<option value="">اختاري العميل / المشروع / الموقع</option>'];P.groups.forEach(g=>opts.push(`<option value="${esc(g.code)}">${esc((g.client_name||'بدون عميل')+' — '+(g.project_name||'')+' — '+g.site_name+(g.city?' — '+g.city:''))}</option>`));$('pSite').innerHTML=opts.join('');if(old&&P.groups.some(g=>g.code===old))$('pSite').value=old;else autoSelect();$('pNotice').style.display='none';renderSheet()}catch(e){$('pNotice').style.display='block';$('pNotice').textContent=e.message;$('sheet').innerHTML=`<div class="sheet-empty"><div><b>تعذر تحميل الكشف</b><div style="margin-top:6px">${esc(e.message)}</div></div></div>`}}
function autoSelect(){try{const d=$('appFrame').contentDocument,q=(d?.getElementById('siteSearch')?.value||'').trim().toLowerCase();if(q){const g=P.groups.find(x=>[x.client_name,x.project_name,x.site_name,x.city].some(v=>String(v||'').toLowerCase().includes(q)));if(g)$('pSite').value=g.code}}catch{}}
function injectUiFix(){try{const d=$('appFrame').contentDocument;if(!d||!d.head)return;if(!d.getElementById('arkanatIdentityFix')){const s=d.createElement('style');s.id='arkanatIdentityFix';s.textContent=`
:root{--brand:#7a171b;--brand2:#9b1b20;--gold:#af971c;--ink:#211c1c;--muted:#6f6a67;--line:#d9d5ce;--soft:#f3f1ed;--bg:#f5f5f3;--shadow:0 8px 24px rgba(43,28,28,.08)}
body{background:#f5f5f3}.top,.tabs{background:rgba(245,245,243,.97)}.mark{background:linear-gradient(145deg,#7a171b,#a91e23);border:2px solid #af971c;box-shadow:0 3px 10px rgba(122,23,27,.18)}
.btn{min-height:42px;padding:9px 14px;border:1px solid transparent;border-radius:9px;font-size:13px;line-height:1.15;box-shadow:0 1px 2px rgba(0,0,0,.05);transition:.15s ease}.btn:hover{transform:translateY(-1px);box-shadow:0 4px 10px rgba(0,0,0,.09)}.btn:focus-visible,.qbtn:focus-visible,.tab:focus-visible{outline:3px solid rgba(175,151,28,.35);outline-offset:2px}.btn.primary{background:#7a171b;border-color:#7a171b}.btn.secondary{background:#f3eded;color:#641419;border-color:#d8b9bb}.btn.gold{background:#f5eed5;color:#5b4a0b;border-color:#d7c67f}.btn.ghost{background:#fff;color:#332c2a;border-color:#cfc9c1}.btn.ok{background:#e8f3ed;color:#195a42;border-color:#b7d3c4}.btn.warn{background:#fff3da;color:#6b5016;border-color:#ead49b}.btn.danger{background:#fff0f0;color:#8a2929;border-color:#e5baba}
.tab{min-height:42px;color:#615b57;border-color:#d0cbc4}.tab.active{background:#7a171b;border-color:#7a171b;color:#fff}.card{border-color:#dedad3}.source-banner{background:#f7f4ea;border-color:#ded2a5}.source-icon{background:#efe6be;color:#66550d}.state{font-weight:800}.state.bad{background:#fff0ed;color:#8f3028}.state.ok{background:#e9f3ee;color:#1d6047}
.qbtn{min-height:36px;min-width:58px;padding:7px 10px;border-radius:8px;border:1px solid #cfc9c1;background:#fff;color:#342e2b;font-size:11px;font-weight:900;box-shadow:0 1px 2px rgba(0,0,0,.04)}.qbtn.p{background:#e7f3ec;border-color:#a8cdbb;color:#15583f}.qbtn.off{background:#f2f2ef;border-color:#cecdc7;color:#4e4b48}.qbtn.a{background:#fff0f0;border-color:#e3b6b6;color:#8d2929}.qbtn[data-detail]{background:#f7f1df;border-color:#d6c681;color:#5d4c10}.quick-status{gap:7px;margin-top:8px}.guard-row{padding:13px 2px;gap:14px}.guard-name{font-size:15px}.guard-meta{font-size:10.5px}.status-chip{min-width:76px;text-align:center;font-size:11px;font-weight:900;padding:7px 9px}
.modal-bg{padding:24px;background:rgba(28,20,20,.52);align-items:center}.modal{width:min(900px,calc(100vw - 48px));max-height:88dvh;overflow:auto;border-radius:16px;padding:20px 22px;border:1px solid #d6d0c9;box-shadow:0 24px 70px rgba(0,0,0,.27);scrollbar-gutter:stable}.modal h3{font-size:19px;color:#2d2422;margin:0 0 8px}.modal-actions{position:sticky;bottom:-20px;margin:16px -22px -20px;padding:12px 22px 14px;background:rgba(255,255,255,.98);border-top:1px solid #e0dbd5;z-index:4}.modal-actions .btn{min-width:110px}.suggestions{max-height:220px}.field input,.field select,.field textarea,.search,.period{min-height:42px;border-color:#cfc9c1;border-radius:9px}.field input:focus,.field select:focus,.field textarea:focus,.search:focus{border-color:#7a171b;box-shadow:0 0 0 3px rgba(122,23,27,.10)}.notice{border-color:#e2cf91;background:#fff8df;color:#654e16}.validation{background:#fff5df;border-color:#e4d09a;color:#654c14}
@media(max-width:700px){.modal-bg{padding:8px}.modal{width:100%;max-height:94dvh;padding:16px}.modal-actions{bottom:-16px;margin:14px -16px -16px;padding:10px 16px 12px}.quick-status{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}.qbtn{width:100%;min-width:0}.guard-row{grid-template-columns:1fr}.status-chip{justify-self:start}.topactions .btn{flex:1}.topactions{gap:6px}}

function bindFrame(){try{injectUiFix();const d=$('appFrame').contentDocument;if(!d)return;const b=d.getElementById('printBtn');if(b){b.textContent='طباعة كشف العميل';b.onclick=e=>{e.preventDefault();e.stopPropagation();openPrint()}}const ta=d.querySelector('.topactions');if(ta&&!d.getElementById('clientPrintTopBtn')){const x=d.createElement('button');x.id='clientPrintTopBtn';x.className='btn ghost';x.textContent='طباعة كشف العميل';x.onclick=e=>{e.preventDefault();openPrint()};const logout=d.getElementById('logoutBtn');ta.insertBefore(x,logout||null)}}catch{}}
async function openPrint(){try{const d=$('appFrame').contentDocument;$('pPeriod').value=d?.getElementById('period')?.value||riyadhToday().slice(0,7)}catch{$('pPeriod').value=riyadhToday().slice(0,7)}$('printShell').classList.add('open');$('printShell').setAttribute('aria-hidden','false');document.body.style.overflow='hidden';await loadData()}
function closePrint(){$('printShell').classList.remove('open');$('printShell').setAttribute('aria-hidden','true');document.body.style.overflow='';document.title=defaultTitle}
$('appFrame').addEventListener('load',()=>{bindFrame();setTimeout(bindFrame,400);setTimeout(bindFrame,1200);setTimeout(bindFrame,2500)});
$('pSite').onchange=renderSheet;$('pPeriod').onchange=loadData;$('pReload').onclick=loadData;$('pClose').onclick=closePrint;
$('pPrint').onclick=()=>{renderSheet();document.title=P.filename||'أركانات - كشف حضور';setTimeout(()=>window.print(),80)};
window.addEventListener('afterprint',()=>document.title=defaultTitle);window.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('printShell').classList.contains('open'))closePrint()});
