<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#123946"><title>أركانات | التحضير التشغيلي</title>
<style>
:root{--brand:#123946;--gold:#c7a24c;--paper:#fbfaf3;--ink:#152a2c;--line:#24483e;--danger:#9d3030}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;background:#f4f7f8;color:var(--ink)}#appFrame{position:fixed;inset:0;width:100%;height:100dvh;border:0}.print-shell{position:fixed;inset:0;z-index:9999;background:#edf2f2;display:none;overflow:auto}.print-shell.open{display:block}.print-toolbar{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid #d9e2e3;box-shadow:0 5px 18px #09293114}.print-toolbar-in{max-width:1500px;margin:auto;padding:10px 14px;display:flex;align-items:end;gap:9px;flex-wrap:wrap}.field{display:flex;flex-direction:column;gap:4px;min-width:170px;flex:1}.field label{font-size:11px;font-weight:800;color:#5f7074}.field select,.field input{border:1px solid #c9d5d8;border-radius:10px;padding:9px 10px;background:#fff;min-height:39px;font:inherit}.tb-btn{border:0;border-radius:10px;padding:10px 13px;font-weight:900;cursor:pointer}.primary{background:var(--brand);color:#fff}.ghost{background:#edf2f3;color:var(--brand)}.gold{background:#efe2bd;color:#604d1d}.notice{max-width:1500px;margin:10px auto;padding:10px 12px;border:1px solid #ead59b;background:#fff9e7;border-radius:10px;font-size:12px}.print-stage{max-width:1600px;margin:auto;padding:14px}.sheet-empty{background:#fff;display:grid;place-items:center;min-height:180mm;text-align:center;color:#6b7a7d}.print-page{position:relative;background:var(--paper);margin:0 auto 14px;padding:5mm;border:1px solid #d7b95e;box-shadow:0 10px 35px #0d2f361c;direction:rtl;min-height:190mm}.sheet-head{display:grid;grid-template-columns:46mm 1fr;gap:4mm;align-items:center;margin-bottom:2.5mm;direction:ltr}.brand-box{display:flex;align-items:center;justify-content:center}.brand-wordmark{width:42mm;border:1px solid var(--gold);border-radius:2mm;padding:2mm 3mm;text-align:center;color:var(--brand);font-weight:900;font-size:11pt;line-height:1.05;background:#fffdf8}.brand-wordmark small{display:block;font-size:5.5pt;font-weight:700;margin-top:1mm}.title-box{direction:rtl;text-align:center}.sheet-title{display:inline-block;background:var(--brand);color:#fff;border:1px solid var(--gold);border-radius:2.5mm;padding:1.7mm 6mm;font-size:10pt;font-weight:900}.meta-strip{display:flex;justify-content:center;gap:2mm;flex-wrap:wrap;margin-top:2mm;font-size:6.3pt}.meta-strip span{background:#fffdf8;border:1px solid #d9bd75;border-radius:1.5mm;padding:.8mm 2mm}.timesheet{width:100%;border-collapse:collapse;table-layout:fixed;border:1px solid var(--line);background:#fff;font-size:5.25pt}.timesheet th,.timesheet td{border:1px solid var(--line);text-align:center;vertical-align:middle;padding:.45mm .22mm;height:4.5mm;line-height:1.05;overflow:hidden}.timesheet thead th{background:#173f36;color:#fff;font-weight:900}.col-no{width:6mm}.col-name{width:34mm}.col-id{width:25mm}.col-job{width:20mm}.col-day{width:5mm}.col-total{width:14mm}.name-cell{text-align:right!important;padding-right:1mm!important;font-size:6pt;font-weight:800}.missing{background:#fff0ef;color:#a33737}.off{background:#eef3f2;color:#455f5a}.cover{background:#fff6dc;color:#765813}.hours-row td{background:#fbfaf5;font-size:4.7pt}.hours-label{text-align:right!important;font-weight:800}.page-cont{display:flex;justify-content:space-between;margin-top:1.2mm;font-size:5.4pt;color:#64716f}.final-block{margin-top:2.4mm}.summary-line{border:1px solid #cbb77c;background:#f3eddd;padding:1.15mm 2mm;text-align:center;font-size:6.15pt;font-weight:800}.metrics-strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:2mm;margin-top:2mm;width:100%;direction:rtl}.legend{display:flex;gap:1.4mm;flex-wrap:wrap;align-content:start;font-size:5.65pt}.legend span{border:1px solid #9aa9a4;background:#fff;padding:.75mm 1.45mm;border-radius:1mm;white-space:nowrap}.kpi{border:1px solid #9cafaa;background:#fff;border-radius:1.2mm;text-align:center;padding:1.2mm 1mm;min-height:10mm}.kpi b{display:block;color:#415552;font-size:5.7pt;margin-bottom:.6mm}.kpi strong{display:block;color:var(--brand);font-size:10pt;line-height:1;font-weight:900}.approvals{display:grid;grid-template-columns:repeat(5,1fr);gap:3mm;margin-top:3.1mm;text-align:center;font-size:6.2pt}.approval{min-height:14mm;padding-top:1mm;border-top:1px solid #d4c79d}.approval b{display:block;font-size:6.7pt;margin-bottom:5mm}.doc-foot{display:flex;justify-content:space-between;border-top:1px solid #d8bd70;margin-top:2mm;padding-top:1.2mm;font-size:5.4pt;color:#5c6a68}.draft{display:inline-block;border:1px solid #c35f5f;color:#a83232;background:#fff1f1;padding:.8mm 2mm;font-size:6pt;font-weight:900;border-radius:1mm;margin-top:1.5mm}.compact .timesheet th,.compact .timesheet td{height:4mm;padding:.32mm .18mm}.compact .sheet-head{margin-bottom:1.8mm}
@media(max-width:800px){.print-stage{padding:5px}.print-page{min-width:1180px}.print-toolbar-in{align-items:stretch}.field{min-width:140px}}
@media print{@page{size:A4 landscape;margin:4mm}html,body{background:#fff!important;height:auto;-webkit-print-color-adjust:exact;print-color-adjust:exact}#appFrame,.print-toolbar,.notice{display:none!important}.print-shell{display:block!important;position:static;overflow:visible;background:#fff}.print-stage{padding:0;max-width:none}.print-page{box-shadow:none;width:100%;min-height:0;margin:0;border:0;padding:2.5mm;break-after:page;page-break-after:always}.print-page:last-child{break-after:auto;page-break-after:auto}.sheet-head{grid-template-columns:42mm 1fr;margin-bottom:1.7mm}.sheet-title{font-size:9pt;padding:1.4mm 5mm}.timesheet{font-size:4.9pt}.timesheet th,.timesheet td{height:4mm;padding:.28mm .15mm}.hours-row td{height:3.5mm}.final-block{break-inside:avoid}.metrics-strip{grid-template-columns:repeat(4,minmax(0,1fr));gap:1.5mm}.kpi{min-height:8.5mm;padding:.9mm}.kpi strong{font-size:8.8pt}.approvals{margin-top:2.5mm}.approval{min-height:11mm}.approval b{margin-bottom:4mm}}
</style></head><body>
<iframe id="appFrame" src="./app-core.html" title="أركانات - التحضير التشغيلي"></iframe>
<div id="printShell" class="print-shell" aria-hidden="true"><div class="print-toolbar"><div class="print-toolbar-in"><div class="field"><label>شهر التحضير</label><input id="pPeriod" type="month"></div><div class="field" style="flex:2"><label>العميل / الموقع</label><select id="pSite"><option value="">جاري تحميل المواقع...</option></select></div><button id="pReload" class="tb-btn ghost">تحديث المعاينة</button><button id="pPrint" class="tb-btn primary">طباعة / حفظ PDF</button><button id="pClose" class="tb-btn gold">العودة للتحضير</button></div></div><div id="pNotice" class="notice" style="display:none"></div><div class="print-stage" id="sheet"><div class="sheet-empty"><b>اختاري العميل / الموقع</b></div></div></div>
<script>
const API='https://dbxvfrkkocfwjumvoaha.supabase.co/functions/v1/arkanat-prep',LOGO='./arkanat-print-logo.svg',$=id=>document.getElementById(id),STATUS={P:'P',OFF:'OFF',A:'A',T:'T',AL:'AL',SK:'SK',S:'S',W:'W',R:'R',O:'O',SUB:'C',CASH:'C',OTHER:'-'};let P={ws:null,groups:[]},oldTitle='أركانات | التحضير التشغيلي';
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function today(){return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Riyadh'}).format(new Date())}function daysIn(p){let[y,m]=p.split('-').map(Number);return new Date(y,m,0).getDate()}function monthName(p){let[y,m]=p.split('-').map(Number);return new Intl.DateTimeFormat('ar-SA-u-ca-gregory',{month:'long',year:'numeric'}).format(new Date(y,m-1,1))}function cleanDate(x){return String(x||'').slice(0,10)}
async function api(action,payload={}){const token=localStorage.getItem('arkPrepToken')||'';if(!token)throw Error('سجلي الدخول إلى التحضير أولاً.');const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action,token,...payload})}),d=await r.json();if(!r.ok||d.ok===false)throw Error(d.message||d.code||'تعذر تحميل البيانات');return d}
function buildGroups(ws){const sites=ws.sites||[],map=new Map();(ws.assignments||[]).forEach(a=>{const code=a.site_code||'__NO_SITE__',s=sites.find(x=>x.site_code===a.site_code)||{};if(!map.has(code))map.set(code,{code,site_name:a.site_name||s.site_name||'بدون موقع',project_name:a.project_name||s.project_name||'',client_name:s.client_name||a.client_name||'',city:s.city||a.city||'',guards:[]});map.get(code).guards.push(a)});return[...map.values()].filter(g=>g.code!=='__NO_SITE__').sort((a,b)=>`${a.client_name} ${a.site_name}`.localeCompare(`${b.client_name} ${b.site_name}`,'ar'))}
function identity(a){return a.national_id||a.identity_number||a.national_id_masked||a.identity_last4||a.employee_ref||'—'}function entry(a,d,p){const k=`${p}-${String(d).padStart(2,'0')}`;return(a.days||[]).find(x=>cleanDate(x.date)===k)}function active(a,d,p){const x=`${p}-${String(d).padStart(2,'0')}`,s=a.start_date||`${p}-01`,e=a.end_date||`${p}-${String(daysIn(p)).padStart(2,'0')}`;return x>=s&&x<=e}function shiftHours(c){const m=String(c||'').match(/(8|12)$/);return m?+m[1]:null}function hours(a,e){if(!e)return'';if(e.worked_hours!==null&&e.worked_hours!==undefined&&e.worked_hours!=='')return+e.worked_hours;if(['P','SUB','CASH'].includes(e.status))return shiftHours(e.shift_code||a.shift_code)||'';return''}function cls(st){if(!st)return'missing';if(['OFF','O','AL','SK'].includes(st))return'off';if(['SUB','CASH'].includes(st))return'cover';return''}
function metrics(g,p){let z={present:0,abs:0,withdraw:0,off:0,coverage:0,missing:0,hours:0};for(const a of g.guards)for(let d=1;d<=daysIn(p);d++){if(!active(a,d,p))continue;const e=entry(a,d,p);if(!e){z.missing++;continue}if(e.status==='P')z.present++;if(e.status==='A')z.abs++;if(e.status==='W')z.withdraw++;if(['OFF','O','AL','SK'].includes(e.status))z.off++;if(['SUB','CASH'].includes(e.status))z.coverage++;z.hours+=Number(hours(a,e)||0)}return z}
function guardRows(a,idx,p){let cells='',hcells='',worked=0,total=0,hasExplicit=false;for(let d=1;d<=daysIn(p);d++){const on=active(a,d,p),e=on?entry(a,d,p):null,st=e?.status||'',c=on?cls(st):'off',code=!on?'':(st?STATUS[st]||st:'—');cells+=`<td class="col-day ${c}">${esc(code)}</td>`;const h=on?hours(a,e):'';hcells+=`<td class="col-day ${c}">${esc(h)}</td>`;if(e&&['P','SUB','CASH'].includes(st))worked++;total+=Number(h||0);if(e&&e.worked_hours!==null&&e.worked_hours!==undefined&&e.worked_hours!=='')hasExplicit=true}let main=`<tr><td class="col-no">${idx+1}</td><td class="col-name name-cell">${esc(a.full_name||'')}</td><td class="col-id">${esc(identity(a))}</td><td class="col-job">${esc(a.job_title||'حارس أمن')}</td>${cells}<td class="col-total">${worked}</td><td class="col-total">${total||''}</td></tr>`;return main+(hasExplicit?`<tr class="hours-row"><td></td><td class="hours-label" colspan="3">ساعات العمل المسجلة</td>${hcells}<td colspan="2">${total||0}</td></tr>`:'')}
function header(g,p,page,total){const n=daysIn(p),region=P.ws?.region_name||'',first=`${p}-01`,last=`${p}-${String(n).padStart(2,'0')}`,label=g.project_name||g.site_name||g.client_name;return `<div class="sheet-head"><div class="brand-box"><div class="brand-wordmark">أركانات<small>للحراسات الأمنية</small></div></div><div class="title-box"><div class="sheet-title">كشف حضور حراس الأمن - ${esc(label)}</div><div class="meta-strip"><span>${esc(region)}${g.city?' - '+esc(g.city):''}</span><span>المشروع: ${esc(g.project_name||'—')}</span><span>${esc(monthName(p))}</span><span>${first} إلى ${last}</span><span>صفحة ${page} من ${total}</span></div></div></div>`}
function tableHead(p){let d='';for(let i=1;i<=daysIn(p);i++)d+=`<th class="col-day">${i}</th>`;return `<thead><tr><th class="col-no">م</th><th class="col-name">اسم الحارس</th><th class="col-id">الهوية / الرقم الوظيفي</th><th class="col-job">المسمى الوظيفي</th>${d}<th class="col-total">الأيام</th><th class="col-total">الساعات</th></tr></thead>`}
function finalBlock(m,p){return `<div class="final-block"><div class="summary-line">الحضور ${m.present} · الغياب ${m.abs} · الانسحاب ${m.withdraw} · الراحة/الإجازات ${m.off} · التغطيات ${m.coverage} · إجمالي الساعات ${m.hours}</div><div class="metrics-strip"><div class="kpi"><b>الحضور</b><strong>${m.present}</strong></div><div class="kpi"><b>الغياب</b><strong>${m.abs}</strong></div><div class="kpi"><b>الانسحاب</b><strong>${m.withdraw}</strong></div><div class="kpi"><b>التغطيات</b><strong>${m.coverage}</strong></div></div><div class="legend" style="margin-top:2mm"><span><b>P</b> حاضر</span><span><b>A</b> غائب</span><span><b>OFF</b> إجازة أسبوعية</span><span><b>T</b> استئذان</span><span><b>AL</b> إجازة سنوية</span><span><b>SK</b> إجازة مرضية</span><span><b>W</b> انسحاب</span><span><b>R</b> استقالة</span><span><b>S</b> توقف عن العمل</span><span><b>C</b> تغطية / بديل</span></div><div class="approvals"><div class="approval"><b>مسؤول العميل / الموقع</b>الاسم / التوقيع</div><div class="approval"><b>مشرف الأمن</b>الاسم / التوقيع</div><div class="approval"><b>مدير إدارة التشغيل</b>الاسم / التوقيع</div><div class="approval"><b>إدارة العمليات الموحدة</b>الاسم / التوقيع</div><div class="approval"><b>إدارة الموارد البشرية</b>الاسم / التوقيع</div></div><div class="doc-foot"><span>شركة أركانات للحراسات الأمنية</span><span>${esc(p)}</span></div></div>`}
function safeName(s){return String(s||'').replace(/[\\/:*?"<>|]+/g,'-').replace(/\s+/g,' ').trim()}
function renderSheet(){const p=$('pPeriod').value,g=P.groups.find(x=>x.code===$('pSite').value);if(!g){$('sheet').innerHTML='<div class="sheet-empty"><b>اختاري العميل / الموقع</b></div>';return}const m=metrics(g,p),perPage=g.guards.length<=8?8:20,chunks=[];for(let i=0;i<g.guards.length;i+=perPage)chunks.push(g.guards.slice(i,i+perPage));const compact=g.guards.length>20?' compact':'';$('sheet').innerHTML=chunks.map((chunk,pi)=>`<section class="print-page${compact}">${header(g,p,pi+1,chunks.length)}<table class="timesheet">${tableHead(p)}<tbody>${chunk.map((a,j)=>guardRows(a,pi*perPage+j,p)).join('')}</tbody></table><div class="page-cont"><span>${esc(g.site_name||g.project_name||'')}</span><span>${pi+1}/${chunks.length}</span></div>${pi===chunks.length-1?finalBlock(m,p):''}${pi===chunks.length-1&&m.missing?`<div class="draft">مسودة - يوجد ${m.missing} يوم/سجل غير مكتمل</div>`:''}</section>`).join('');$('pNotice').style.display=m.missing?'block':'none';$('pNotice').textContent=m.missing?`تنبيه: يوجد ${m.missing} يوم/سجل غير مكتمل.`:'';const place=safeName(g.project_name||g.site_name||g.client_name),reg=safeName(P.ws?.region_name||'');P.filename=`أركانات - كشف حضور - ${place} - ${reg} - ${safeName(monthName(p))}`}
async function loadData(){try{$('pNotice').style.display='block';$('pNotice').textContent='جاري تحميل البيانات...';P.ws=await api('workspace',{period:$('pPeriod').value});P.groups=buildGroups(P.ws);const old=$('pSite').value,opts=['<option value="">اختاري العميل / الموقع</option>'];P.groups.forEach(g=>opts.push(`<option value="${esc(g.code)}">${esc((g.client_name||'بدون عميل')+' — '+(g.project_name||'')+' — '+g.site_name+(g.city?' — '+g.city:''))}</option>`));$('pSite').innerHTML=opts.join('');if(old&&P.groups.some(g=>g.code===old))$('pSite').value=old;else autoSelect();$('pNotice').style.display='none';renderSheet()}catch(e){$('pNotice').style.display='block';$('pNotice').textContent=e.message;$('sheet').innerHTML=`<div class="sheet-empty"><b>تعذر تحميل الكشف</b><div>${esc(e.message)}</div></div>`}}
function autoSelect(){try{const d=$('appFrame').contentDocument,q=(d?.getElementById('siteSearch')?.value||'').trim().toLowerCase();if(q){const g=P.groups.find(x=>[x.client_name,x.project_name,x.site_name,x.city].some(v=>String(v||'').toLowerCase().includes(q)));if(g)$('pSite').value=g.code}}catch{}}
async function openPrint(){const d=$('appFrame').contentDocument;$('pPeriod').value=d?.getElementById('period')?.value||today().slice(0,7);$('printShell').classList.add('open');document.body.style.overflow='hidden';await loadData()}function closePrint(){$('printShell').classList.remove('open');document.body.style.overflow='';document.title=oldTitle}
function bindFrame(){try{const d=$('appFrame').contentDocument;if(!d)return;const b=d.getElementById('printBtn');if(b){b.textContent='طباعة كشف العميل';b.onclick=e=>{e.preventDefault();e.stopPropagation();openPrint()}}const ta=d.querySelector('.topactions');if(ta&&!d.getElementById('clientPrintTopBtn')){const x=d.createElement('button');x.id='clientPrintTopBtn';x.className='btn ghost';x.textContent='طباعة كشف العميل';x.onclick=e=>{e.preventDefault();openPrint()};ta.insertBefore(x,d.getElementById('logoutBtn'))}}catch{}}
$('appFrame').addEventListener('load',()=>{bindFrame();setTimeout(bindFrame,700);setTimeout(bindFrame,2000)});$('pSite').onchange=renderSheet;$('pPeriod').onchange=loadData;$('pReload').onclick=loadData;$('pPrint').onclick=()=>{renderSheet();document.title=P.filename||'أركانات - كشف حضور';setTimeout(()=>window.print(),50)};$('pClose').onclick=closePrint;window.addEventListener('afterprint',()=>document.title=oldTitle);window.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('printShell').classList.contains('open'))closePrint()});
</script></body></html>
