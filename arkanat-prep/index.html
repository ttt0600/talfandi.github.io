<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#123946">
<title>أركانات | التحضير التشغيلي</title>
<style>
:root{--brand:#123946;--brand2:#1f6576;--gold:#c7a24c;--paper:#fbfaf3;--ink:#152a2c;--line:#173f36;--soft:#f5f1e5;--danger:#9d3030;--ok:#21634f}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;background:#f4f7f8;color:var(--ink)}
#appFrame{position:fixed;inset:0;width:100%;height:100dvh;border:0;background:#f4f7f8}
.print-shell{position:fixed;inset:0;z-index:9999;background:#eef2f2;display:none;overflow:auto}
.print-shell.open{display:block}
.print-toolbar{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid #d9e2e3;box-shadow:0 5px 18px rgba(9,41,49,.08)}
.print-toolbar-in{max-width:1500px;margin:auto;padding:10px 14px;display:flex;align-items:end;gap:9px;flex-wrap:wrap}
.print-toolbar .field{display:flex;flex-direction:column;gap:4px;min-width:170px;flex:1}
.print-toolbar label{font-size:11px;font-weight:800;color:#5f7074}
.print-toolbar select,.print-toolbar input{border:1px solid #c9d5d8;border-radius:10px;padding:9px 10px;background:#fff;min-height:39px;font:inherit}
.tb-btn{border:0;border-radius:10px;padding:10px 13px;font-weight:900;cursor:pointer;white-space:nowrap}
.tb-primary{background:var(--brand);color:#fff}.tb-gold{background:#efe2bd;color:#604d1d}.tb-ghost{background:#edf2f3;color:var(--brand)}
.print-stage{max-width:1600px;margin:auto;padding:16px}
.notice{max-width:1500px;margin:0 auto 10px;padding:10px 12px;border:1px solid #ead59b;background:#fff9e7;border-radius:10px;font-size:12px;line-height:1.7}
.sheet{background:var(--paper);margin:auto;box-shadow:0 12px 40px rgba(13,47,54,.16);border:1px solid #d7b95e;min-height:200mm;padding:6mm;direction:rtl}
.sheet-empty{display:grid;place-items:center;min-height:180mm;text-align:center;color:#6b7a7d}
.sheet-head{display:grid;grid-template-columns:36% 1fr;gap:8mm;align-items:center;margin-bottom:3mm;direction:ltr}
.brand-box{direction:rtl;display:flex;align-items:center;gap:4mm;min-width:0}
.brand-logo{width:50mm;height:29mm;object-fit:cover;object-position:center;border-radius:2mm}
.title-box{direction:rtl;text-align:center}
.sheet-title{display:inline-block;background:var(--brand);color:#fff;border:1.2px solid var(--gold);outline:1px solid var(--brand);border-radius:3mm;padding:2.2mm 8mm;font-size:12pt;font-weight:900;line-height:1.35;min-width:72mm}
.period-cards{display:flex;justify-content:center;gap:3mm;margin-top:3mm}
.period-card{min-width:42mm;border:1px solid #d4ad54;border-radius:2mm;background:#fffdf7;padding:1.5mm 3mm;font-size:7pt;line-height:1.55}
.period-card b{display:block;font-size:8pt}
.meta-line{font-size:7pt;color:#384d4f;margin-top:1.5mm}
.timesheet-wrap{width:100%;overflow:visible}
.timesheet{width:100%;border-collapse:collapse;table-layout:fixed;border:1px solid #1a3b35;direction:rtl;font-size:5.6pt;background:#fff}
.timesheet th,.timesheet td{border:1px solid #28493f;text-align:center;vertical-align:middle;padding:.65mm .35mm;height:5.1mm;line-height:1.1;overflow:hidden}
.timesheet thead th{background:#173f36;color:#fff;font-weight:900}
.timesheet .col-no{width:7mm}.timesheet .col-name{width:34mm}.timesheet .col-id{width:25mm}.timesheet .col-job{width:20mm}
.timesheet .col-day{width:5.1mm;font-size:5pt}.timesheet .col-total{width:16mm}
.timesheet .name-cell{font-size:6.4pt;font-weight:800;text-align:right;padding-right:1.2mm}
.timesheet .hours-label{font-weight:900;text-align:right;padding-right:1.2mm;background:#f1eee3}
.timesheet .hours-row td{background:#fbfaf5}
.timesheet .missing{background:#fff0ef;color:#a33737}
.timesheet .off{background:#eef3f2;color:#455f5a}
.timesheet .cover{background:#fff6dc;color:#765813}
.timesheet .sum-row td{font-weight:900;background:#f0eadb}
.legend-summary{display:grid;grid-template-columns:1fr auto;gap:6mm;align-items:start;margin-top:3mm}
.legend{display:flex;gap:2mm;flex-wrap:wrap;font-size:6.2pt}
.legend span{border:1px solid #9aa9a4;background:#fff;padding:1mm 2mm;border-radius:1mm}
.summary{border-collapse:collapse;font-size:6.5pt;background:#fff;min-width:62mm}
.summary td{border:1px solid #36544b;padding:1.2mm 2.4mm;text-align:center}
.summary td:first-child{font-weight:900;background:#f5f2e9}
.approvals{display:grid;grid-template-columns:repeat(5,1fr);gap:3mm;margin-top:4mm;text-align:center;font-size:7pt}
.approval{min-height:17mm;padding-top:1.2mm;border-top:1px solid #d4c79d}
.approval b{display:block;font-size:7.5pt;margin-bottom:7mm}
.doc-foot{display:flex;justify-content:space-between;gap:5mm;border-top:1px solid #d8bd70;margin-top:2mm;padding-top:1.4mm;font-size:5.8pt;color:#5c6a68}
.draft{position:absolute;inset:auto 8mm 8mm auto;border:1px solid #c35f5f;color:#a83232;background:#fff1f1;padding:1mm 3mm;font-size:7pt;font-weight:900;border-radius:1mm}
.sheet-pos{position:relative}
@media(max-width:800px){.print-stage{padding:6px}.sheet{min-width:1180px}.print-toolbar-in{align-items:stretch}.print-toolbar .field{min-width:140px}}
@media print{
 @page{size:A4 landscape;margin:5mm}
 html,body{background:#fff!important;height:auto}
 #appFrame,.print-toolbar,.notice{display:none!important}
 .print-shell{display:block!important;position:static;overflow:visible;background:#fff}
 .print-stage{padding:0;max-width:none}
 .sheet{box-shadow:none;border:1px solid #d7b95e;width:100%;min-height:0;padding:4mm;margin:0}
 .sheet-head{margin-bottom:2mm;gap:4mm}
 .brand-logo{width:42mm;height:24mm}
 .sheet-title{font-size:10pt;padding:1.8mm 6mm}
 .period-cards{margin-top:2mm}
 .period-card{padding:1mm 2mm;font-size:6pt}
 .timesheet{font-size:5.1pt}
 .timesheet th,.timesheet td{height:4.5mm;padding:.4mm .2mm}
 .legend-summary{margin-top:2mm}
 .approvals{margin-top:3mm}
 .approval{min-height:13mm}
 .approval b{margin-bottom:5mm}
 .sheet-pos{break-inside:auto}
 .guard-block{break-inside:avoid;page-break-inside:avoid}
 thead{display:table-header-group}
 tfoot{display:table-footer-group}
}
</style>
</head>
<body>
<iframe id="appFrame" src="./app-core.html" title="أركانات - التحضير التشغيلي"></iframe>
<div id="printShell" class="print-shell" aria-hidden="true">
  <div class="print-toolbar"><div class="print-toolbar-in">
    <div class="field"><label>شهر التحضير</label><input id="pPeriod" type="month"></div>
    <div class="field" style="flex:2"><label>العميل / الموقع</label><select id="pSite"><option value="">جاري تحميل المواقع...</option></select></div>
    <button id="pReload" class="tb-btn tb-ghost">تحديث المعاينة</button>
    <button id="pPrint" class="tb-btn tb-primary">طباعة / حفظ PDF</button>
    <button id="pClose" class="tb-btn tb-gold">العودة للتحضير</button>
  </div></div>
  <div id="pNotice" class="notice" style="display:none"></div>
  <div class="print-stage"><div id="sheet" class="sheet"><div class="sheet-empty"><div><b>اختاري العميل / الموقع</b><div style="margin-top:6px">سيتم إنشاء كشف شهري مخصص للطباعة.</div></div></div></div></div>
</div>
<script>
const API='https://dbxvfrkkocfwjumvoaha.supabase.co/functions/v1/arkanat-prep';
const LOGO='./arkanat-print-logo.svg';
const $=id=>document.getElementById(id);
const STATUS_PRINT={P:'P',OFF:'OFF',A:'A',T:'T',AL:'AL',SK:'SK',S:'S',W:'W',R:'R',O:'O',SUB:'C',CASH:'C',OTHER:'-'};
let P={ws:null,groups:[]};
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function riyadhToday(){const p=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Riyadh',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());const o=Object.fromEntries(p.map(x=>[x.type,x.value]));return `${o.year}-${o.month}-${o.day}`}
function daysIn(period){const [y,m]=period.split('-').map(Number);return new Date(y,m,0).getDate()}
function monthName(period){const [y,m]=period.split('-').map(Number);return new Intl.DateTimeFormat('ar-SA-u-ca-gregory',{month:'long',year:'numeric'}).format(new Date(y,m-1,1))}
function cleanDate(x){return String(x||'').slice(0,10)}
async function api(action,payload={}){const token=localStorage.getItem('arkPrepToken')||'';if(!token)throw new Error('سجلي الدخول إلى التحضير أولاً.');const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action,token,...payload})});const d=await r.json();if(!r.ok||d.ok===false)throw new Error(d.message||d.code||'تعذر تحميل البيانات');return d}
function buildGroups(ws){const sites=ws.sites||[],map=new Map();(ws.assignments||[]).forEach(a=>{const code=a.site_code||'__NO_SITE__';const s=sites.find(x=>x.site_code===a.site_code)||{};if(!map.has(code))map.set(code,{code,site_code:a.site_code||'',site_name:a.site_name||s.site_name||'بدون موقع',project_name:a.project_name||s.project_name||'',client_name:s.client_name||a.client_name||'',city:s.city||a.city||'',guards:[]});map.get(code).guards.push(a)});return [...map.values()].filter(g=>g.code!=='__NO_SITE__').sort((a,b)=>`${a.client_name} ${a.site_name}`.localeCompare(`${b.client_name} ${b.site_name}`,'ar'))}
function identityValue(a){return a.national_id||a.identity_number||a.national_id_masked||a.identity_last4||a.employee_ref||'—'}
function dayEntry(a,day,period){const key=`${period}-${String(day).padStart(2,'0')}`;return (a.days||[]).find(d=>cleanDate(d.date)===key)}
function activeOn(a,day,period){const d=`${period}-${String(day).padStart(2,'0')}`,s=a.start_date||`${period}-01`,e=a.end_date||`${period}-${String(daysIn(period)).padStart(2,'0')}`;return d>=s&&d<=e}
function shiftHours(code){const m=String(code||'').match(/(8|12)$/);return m?Number(m[1]):null}
function hoursFor(a,d){if(!d)return'';if(d.worked_hours!==null&&d.worked_hours!==undefined&&d.worked_hours!=='')return Number(d.worked_hours);if(['P','SUB','CASH'].includes(d.status))return shiftHours(d.shift_code||a.shift_code)||'';return''}
function dayClass(st){if(!st)return'missing';if(['OFF','O','AL','SK'].includes(st))return'off';if(['SUB','CASH'].includes(st))return'cover';return''}
function workedDay(st){return ['P','SUB','CASH'].includes(st)}
function sheetMetrics(g,period){let present=0,abs=0,withdraw=0,off=0,coverage=0,missing=0,hours=0;const n=daysIn(period);g.guards.forEach(a=>{for(let d=1;d<=n;d++){if(!activeOn(a,d,period))continue;const e=dayEntry(a,d,period);if(!e){missing++;continue}if(e.status==='P')present++;if(e.status==='A')abs++;if(e.status==='W')withdraw++;if(['OFF','O','AL','SK'].includes(e.status))off++;if(['SUB','CASH'].includes(e.status))coverage++;hours+=Number(hoursFor(a,e)||0)}});return{present,abs,withdraw,off,coverage,missing,hours}}
function guardRows(a,idx,period){const n=daysIn(period);let status='',hours='',days=0,totalHours=0;for(let d=1;d<=n;d++){const active=activeOn(a,d,period),e=active?dayEntry(a,d,period):null,st=e?.status||'';const cls=active?dayClass(st):'off';const code=!active?'':(st?STATUS_PRINT[st]||st:'—');status+=`<td class="col-day ${cls}">${esc(code)}</td>`;const h=active?hoursFor(a,e):'';hours+=`<td class="col-day ${cls}">${esc(h)}</td>`;if(e&&workedDay(st))days++;totalHours+=Number(h||0)}return `<tbody class="guard-block"><tr><td class="col-no" rowspan="2">${idx+1}</td><td class="col-name name-cell">${esc(a.full_name||'')}</td><td class="col-id">${esc(identityValue(a))}</td><td class="col-job">${esc(a.job_title||'حارس أمن')}</td>${status}<td class="col-total">${days}</td><td class="col-total">${totalHours||''}</td></tr><tr class="hours-row"><td class="hours-label" colspan="3">عدد ساعات العمل</td>${hours}<td class="col-total" colspan="2">${totalHours||0}</td></tr></tbody>`}
function renderSheet(){const code=$('pSite').value,period=$('pPeriod').value;const g=P.groups.find(x=>x.code===code);if(!g){$('sheet').innerHTML='<div class="sheet-empty"><b>اختاري العميل / الموقع</b></div>';return}const n=daysIn(period),m=sheetMetrics(g,period);let days='';for(let d=1;d<=n;d++)days+=`<th class="col-day">${d}</th>`;const rows=g.guards.map((a,i)=>guardRows(a,i,period)).join('');const region=P.ws?.region_name||'';const city=g.city?` - ${g.city}`:'';const client=g.client_name||g.project_name||g.site_name;const title=`جدول حضور حراس الأمن (${client}${g.site_name&&g.site_name!==client?' - '+g.site_name:''}) لشهر ${monthName(period)}`;const first=`${period}-01`,last=`${period}-${String(n).padStart(2,'0')}`;const draft=m.missing>0?`<div class="draft">مسودة - يوجد ${m.missing} يوم/سجل غير مكتمل</div>`:'';
$('sheet').innerHTML=`<div class="sheet-pos">${draft}<div class="sheet-head"><div class="brand-box"><img class="brand-logo" src="${LOGO}" alt="شركة أركانات للحراسات الأمنية"></div><div class="title-box"><div class="sheet-title">${esc(title)}</div><div class="period-cards"><div class="period-card"><b>الفترة السنوية</b>${period.slice(0,4)}</div><div class="period-card"><b>فترة التحضير</b>${first} إلى ${last}</div></div><div class="meta-line">${esc(region)}${esc(city)} · مشروع: ${esc(g.project_name||'—')}</div></div></div><div class="timesheet-wrap"><table class="timesheet"><thead><tr><th class="col-no">م</th><th class="col-name">اسم الحارس</th><th class="col-id">الهوية / الرقم الوظيفي</th><th class="col-job">المسمى الوظيفي</th>${days}<th class="col-total">إجمالي الأيام</th><th class="col-total">إجمالي الساعات</th></tr></thead>${rows}<tbody><tr class="sum-row"><td colspan="4">إجمالي التغطية الشهرية</td><td colspan="${n}">الحضور ${m.present} · الغياب ${m.abs} · الانسحاب ${m.withdraw} · الراحة/الإجازات ${m.off} · التغطيات ${m.coverage}</td><td colspan="2">${m.hours} ساعة</td></tr></tbody></table></div><div class="legend-summary"><div class="legend"><span><b>P</b> حاضر</span><span><b>A</b> غائب</span><span><b>OFF</b> إجازة أسبوعية</span><span><b>T</b> استئذان</span><span><b>AL</b> إجازة سنوية</span><span><b>SK</b> إجازة مرضية</span><span><b>W</b> انسحاب</span><span><b>R</b> استقالة</span><span><b>S</b> توقف عن العمل</span><span><b>C</b> تغطية / بديل</span></div><table class="summary"><tr><td>الحضور</td><td>${m.present}</td></tr><tr><td>الغياب</td><td>${m.abs}</td></tr><tr><td>الانسحاب</td><td>${m.withdraw}</td></tr><tr><td>التغطيات</td><td>${m.coverage}</td></tr></table></div><div class="approvals"><div class="approval"><b>مسؤول العميل / الموقع</b>الاسم / التوقيع</div><div class="approval"><b>مشرف الأمن</b>الاسم / التوقيع</div><div class="approval"><b>مدير إدارة التشغيل</b>الاسم / التوقيع</div><div class="approval"><b>إدارة العمليات الموحدة</b>الاسم / التوقيع</div><div class="approval"><b>إدارة الموارد البشرية</b>الاسم / التوقيع</div></div><div class="doc-foot"><span>شركة أركانات للحراسات الأمنية</span><span>كشف تحضير تشغيلي شهري - نسخة العميل</span><span>${esc(period)}</span></div></div>`;$('pNotice').style.display=m.missing?'block':'none';$('pNotice').textContent=m.missing?`تنبيه: الكشف يحتوي على ${m.missing} يوم/سجل لم يكتمل تحضيره بعد. ستظهر كلمة «مسودة» في الطباعة حتى اكتمال البيانات.`:''}
async function loadPrintData(){try{$('pNotice').style.display='block';$('pNotice').textContent='جاري تحميل بيانات التحضير...';const period=$('pPeriod').value;P.ws=await api('workspace',{period});P.groups=buildGroups(P.ws);const old=$('pSite').value;const opts=['<option value="">اختاري العميل / الموقع</option>'];P.groups.forEach(g=>opts.push(`<option value="${esc(g.code)}">${esc((g.client_name||'بدون عميل')+' — '+(g.project_name||'')+' — '+g.site_name+(g.city?' — '+g.city:''))}</option>`));$('pSite').innerHTML=opts.join('');if(old&&P.groups.some(g=>g.code===old))$('pSite').value=old;else autoSelectFromApp();$('pNotice').style.display='none';renderSheet()}catch(e){$('pNotice').style.display='block';$('pNotice').textContent=e.message;$('sheet').innerHTML='<div class="sheet-empty"><b>تعذر تحميل الكشف</b><div style="margin-top:6px">'+esc(e.message)+'</div></div>'}}
function autoSelectFromApp(){try{const d=$('appFrame').contentDocument,q=(d?.getElementById('siteSearch')?.value||'').trim().toLowerCase();if(q){const g=P.groups.find(x=>[x.client_name,x.project_name,x.site_name,x.city].some(v=>String(v||'').toLowerCase().includes(q)));if(g)$('pSite').value=g.code}}catch{}}
async function openPrint(){const d=$('appFrame').contentDocument;const per=d?.getElementById('period')?.value||riyadhToday().slice(0,7);$('pPeriod').value=per;$('printShell').classList.add('open');$('printShell').setAttribute('aria-hidden','false');document.body.style.overflow='hidden';await loadPrintData()}
function closePrint(){$('printShell').classList.remove('open');$('printShell').setAttribute('aria-hidden','true');document.body.style.overflow=''}
function bindFrame(){const f=$('appFrame');try{const d=f.contentDocument;if(!d)return;const b=d.getElementById('printBtn');if(b){b.textContent='طباعة كشف العميل';b.onclick=e=>{e.preventDefault();e.stopPropagation();openPrint()}}const ta=d.querySelector('.topactions');if(ta&&!d.getElementById('clientPrintTopBtn')){const x=d.createElement('button');x.id='clientPrintTopBtn';x.className='btn ghost';x.textContent='طباعة كشف العميل';x.onclick=e=>{e.preventDefault();openPrint()};ta.insertBefore(x,d.getElementById('logoutBtn'))}}catch(e){console.warn(e)}}
$('appFrame').addEventListener('load',()=>{bindFrame();setTimeout(bindFrame,700);setTimeout(bindFrame,2000)});
$('pSite').onchange=renderSheet;$('pPeriod').onchange=loadPrintData;$('pReload').onclick=loadPrintData;$('pPrint').onclick=()=>window.print();$('pClose').onclick=closePrint;
window.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('printShell').classList.contains('open'))closePrint()});
</script>
</body>
</html>
