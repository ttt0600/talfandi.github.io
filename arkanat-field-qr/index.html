<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#173f31">
<title>أركانات | الرصد الميداني QR</title>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js"></script>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;color:#17241d;background:#f4f7f5}*{box-sizing:border-box}body{margin:0;direction:rtl}main{max-width:660px;margin:auto;padding:26px 16px 44px}.brand{font-size:27px;font-weight:900;color:#173f31}.sub{color:#69776f;font-size:14px;line-height:1.7}.card{margin-top:18px;background:#fff;border:1px solid #dce6e0;border-radius:20px;padding:22px;box-shadow:0 8px 26px rgba(20,60,40,.06)}label{display:block;font-weight:800;margin:13px 0 6px}input{width:100%;padding:13px 14px;border:1px solid #cfdad4;border-radius:13px;font-size:17px;background:#fff}input:focus{outline:3px solid #dcefe5;border-color:#1d6b4a}button,.btn{border:0;border-radius:13px;background:#1d6b4a;color:#fff;padding:13px 17px;font-weight:800;font-size:16px;text-decoration:none;display:inline-block;cursor:pointer}.soft{background:#edf4f0;color:#194d37}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.note{background:#eef5f1;border-radius:13px;padding:12px 14px;margin:12px 0;line-height:1.7}.ok{color:#12633f}.warn{color:#9b5c00}.bad{color:#a22626}.spin{width:36px;height:36px;border:4px solid #dbe5df;border-top-color:#1d6b4a;border-radius:50%;margin:14px auto;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}.center{text-align:center}.qr-tools{margin:18px 0}.print-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6mm}.qr-card{min-height:47mm;display:flex;align-items:center;justify-content:center;break-inside:avoid;background:#fff}.qr-card canvas{width:42mm!important;height:42mm!important}.hidden{display:none!important}@media(max-width:600px){.print-grid{grid-template-columns:repeat(2,1fr);gap:10px}.qr-card{min-height:auto}.qr-card canvas{width:150px!important;height:150px!important}}@media print{body{background:#fff}main{max-width:none;padding:0}.brand,.sub,.card>h2,.card>p,.card>form,.qr-tools,#state,.screen-only{display:none!important}.card{border:0;box-shadow:none;padding:0;margin:0}.print-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:4mm}.qr-card{min-height:45mm}.qr-card canvas{width:42mm!important;height:42mm!important}}
</style>
</head>
<body>
<main>
<div class="brand">أركانات للحراسات الأمنية</div>
<div id="subtitle" class="sub">نظام الرصد الميداني السريع</div>
<section class="card">
<div id="app"></div>
</section>
</main>
<script>
const API='https://dbxvfrkkocfwjumvoaha.supabase.co/functions/v1/guard-control-uat-helper';
const qs=new URLSearchParams(location.search), OPS=qs.get('ops'), TOKEN=qs.get('p')||qs.get('field');
const app=document.getElementById('app');
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function deviceId(){let x=localStorage.getItem('arkanat_field_device_v3');if(!x){x=crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random();localStorage.setItem('arkanat_field_device_v3',x)}return x}
async function post(body){const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});const z=await r.json().catch(()=>({}));if(!r.ok||!z.ok)throw new Error(z.message||'تعذر تنفيذ الطلب');return z}
function opsView(){document.getElementById('subtitle').textContent='إدارة العمليات — إنشاء دفعة QR للمشرف';app.innerHTML=`<h2>بيانات المشرف</h2><p class="sub">أدخل بيانات المشرف وعدد الرموز المطلوبة. ستظهر صفحة طباعة تحتوي على QR فقط.</p><form id="f"><label>اسم المشرف</label><input id="name" required maxlength="120" placeholder="الاسم الرباعي"><label>رقم الهوية</label><input id="nid" inputmode="numeric" required maxlength="10" pattern="[12][0-9]{9}" placeholder="10 أرقام"><label>رقم الجوال</label><input id="phone" inputmode="tel" required maxlength="14" placeholder="05xxxxxxxx"><label>عدد أكواد QR</label><input id="count" type="number" inputmode="numeric" min="1" max="100" value="20" required><div class="actions"><button id="send" type="submit">إنشاء الأكواد</button></div></form><div id="state"></div><div id="printArea" class="hidden"><div class="qr-tools screen-only"><button onclick="window.print()">طباعة / حفظ PDF</button> <button class="soft" onclick="location.reload()">دفعة جديدة</button></div><div id="qrGrid" class="print-grid"></div></div>`;
const f=document.getElementById('f'),state=document.getElementById('state');f.onsubmit=async e=>{e.preventDefault();const b=document.getElementById('send');b.disabled=true;b.textContent='جارٍ الإنشاء…';state.innerHTML='<div class="spin"></div>';try{const z=await post({action:'create_batch',ops_key:OPS,supervisor_name:document.getElementById('name').value,national_id:document.getElementById('nid').value,phone:document.getElementById('phone').value,qr_count:Number(document.getElementById('count').value),frontend_base:location.origin+location.pathname});f.classList.add('hidden');state.innerHTML='<div class="center"><h2 class="ok">تم إنشاء '+z.qr_count+' رمز QR</h2><p class="sub">تم ربط الدفعة بالمشرف. الطباعة أدناه تحتوي على الأكواد فقط.</p></div>';const g=document.getElementById('qrGrid');g.innerHTML='';(z.qr_tokens||[]).forEach(x=>{const d=document.createElement('div');d.className='qr-card';const c=document.createElement('canvas');d.appendChild(c);g.appendChild(d);QRCode.toCanvas(c,(location.origin+location.pathname)+'?p='+encodeURIComponent(x.raw_token),{width:360,margin:2,errorCorrectionLevel:'M'});});document.getElementById('printArea').classList.remove('hidden');if(!z.qr_tokens||z.qr_tokens.length!==z.qr_count)state.innerHTML+='<p class="bad">لم تُحمّل جميع الرموز للطباعة. أعد المحاولة قبل التوزيع.</p>';}catch(err){state.innerHTML='<p class="bad">'+esc(err.message||err)+'</p>';b.disabled=false;b.textContent='إعادة المحاولة'}}}
function scanView(){document.getElementById('subtitle').textContent='إثبات التواجد الميداني';app.innerHTML=`<h2>تسجيل التواجد</h2><p class="sub">أدخل رقم الهوية والجوال فقط. يجمع النظام وقت الخادم والموقع الجغرافي عند الإرسال.</p><div id="gps" class="note">جارٍ تجهيز الموقع…</div><form id="f"><label>رقم الهوية</label><input id="nid" inputmode="numeric" maxlength="10" pattern="[12][0-9]{9}" required placeholder="10 أرقام"><label>رقم الجوال</label><input id="phone" inputmode="tel" maxlength="14" required placeholder="05xxxxxxxx"><div class="actions"><button id="send" type="submit">إرسال وإثبات التواجد</button></div></form><div id="state"></div>`;let LOC=null,LS='loading';const gps=document.getElementById('gps');if(!navigator.geolocation){LS='unsupported';gps.innerHTML='<b class="warn">الموقع غير مدعوم في هذا الجهاز.</b> سيتم تسجيل ذلك للمراجعة.'}else navigator.geolocation.getCurrentPosition(p=>{LOC=p.coords;LS='granted';gps.innerHTML='<b class="ok">تم تجهيز الموقع الجغرافي</b> · الدقة التقريبية '+Math.round(p.coords.accuracy||0)+' م'},e=>{LS=e.code===1?'denied':'unavailable';gps.innerHTML='<b class="warn">تعذر تجهيز الموقع.</b> يمكنك الإرسال وسيتم تسجيل الحالة للمراجعة.'},{enableHighAccuracy:true,timeout:18000,maximumAge:0});const f=document.getElementById('f'),state=document.getElementById('state');f.onsubmit=async e=>{e.preventDefault();const b=document.getElementById('send'),c=LOC;b.disabled=true;b.textContent='جارٍ الإرسال…';state.innerHTML='<div class="spin"></div>';try{const z=await post({action:'scan',checkpoint_token:TOKEN,event_nonce:crypto.randomUUID?crypto.randomUUID():String(Date.now()),device_id:deviceId(),national_id:document.getElementById('nid').value,phone:document.getElementById('phone').value,client_ts:new Date().toISOString(),location_status:LS,timezone:Intl.DateTimeFormat().resolvedOptions().timeZone||'',locale:navigator.language||'',viewport:innerWidth+'x'+innerHeight,network_type:(navigator.connection&&navigator.connection.effectiveType)||'',lat:c&&c.latitude,lng:c&&c.longitude,accuracy_m:c&&c.accuracy,altitude_m:c&&c.altitude,heading_deg:c&&c.heading,speed_mps:c&&c.speed});f.classList.add('hidden');gps.classList.add('hidden');state.innerHTML='<div class="center"><div style="font-size:54px">✓</div><h2 class="ok">تم تسجيل التواجد</h2><p><b>'+esc(z.server_time_local)+'</b></p>'+(z.guard_name?'<p>تمت مطابقة الموظف: '+esc(z.guard_name)+'</p>':'<p class="sub">تم حفظ البيانات للمطابقة.</p>')+(z.risk_score>0?'<p class="warn">تم تسجيل ملاحظة تحقق آلية للمراجعة.</p>':'')+'</div>'}catch(err){state.innerHTML='<p class="bad">'+esc(err.message||err)+'</p>';b.disabled=false;b.textContent='إعادة الإرسال'}}}
if(OPS)opsView();else if(TOKEN)scanView();else{app.innerHTML='<h2>الرابط غير مكتمل</h2><p class="sub">استخدم رابط إدارة العمليات أو امسح رمز QR معتمد.</p>'}
</script>
</body>
</html>
