<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#173f31">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; connect-src 'self' https://dbxvfrkkocfwjumvoaha.supabase.co; img-src 'self' data: blob:; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'">
<title>أركانات | الرصد الميداني QR</title>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js" onerror="window.__qrLibFailed=true"></script>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;color:#17241d;background:#f4f7f5}*{box-sizing:border-box}body{margin:0;direction:rtl}main{max-width:660px;margin:auto;padding:26px 16px 44px}.brand{font-size:27px;font-weight:900;color:#173f31}.sub{color:#69776f;font-size:14px;line-height:1.7}.card{margin-top:18px;background:#fff;border:1px solid #dce6e0;border-radius:20px;padding:22px;box-shadow:0 8px 26px rgba(20,60,40,.06)}label{display:block;font-weight:800;margin:13px 0 6px}input{width:100%;padding:13px 14px;border:1px solid #cfdad4;border-radius:13px;font-size:17px;background:#fff}input:focus{outline:3px solid #dcefe5;border-color:#1d6b4a}button,.btn{border:0;border-radius:13px;background:#1d6b4a;color:#fff;padding:13px 17px;font-weight:800;font-size:16px;text-decoration:none;display:inline-block;cursor:pointer}button:disabled{opacity:.55;cursor:not-allowed}.soft{background:#edf4f0;color:#194d37}.danger{background:#8d2f2f}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.note{background:#eef5f1;border-radius:13px;padding:12px 14px;margin:12px 0;line-height:1.7}.ok{color:#12633f}.warn{color:#9b5c00}.bad{color:#a22626}.spin{width:36px;height:36px;border:4px solid #dbe5df;border-top-color:#1d6b4a;border-radius:50%;margin:14px auto;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}.center{text-align:center}.qr-tools{margin:18px 0}.print-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6mm}.qr-card{min-height:47mm;display:flex;align-items:center;justify-content:center;break-inside:avoid;background:#fff}.qr-card canvas{width:42mm!important;height:42mm!important}.hidden{display:none!important}details{margin-top:20px;border-top:1px solid #e3ebe6;padding-top:15px}summary{font-weight:800;cursor:pointer}.pending{font-size:13px;color:#8b6300;margin-top:10px}
@media(max-width:600px){.print-grid{grid-template-columns:repeat(2,1fr);gap:10px}.qr-card{min-height:auto}.qr-card canvas{width:150px!important;height:150px!important}}@media print{body{background:#fff}main{max-width:none;padding:0}.brand,.sub,.card>h2,.card>p,.card>form,.qr-tools,#state,.screen-only,details{display:none!important}.card{border:0;box-shadow:none;padding:0;margin:0}.print-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:4mm}.qr-card{min-height:45mm}.qr-card canvas{width:42mm!important;height:42mm!important}}
</style>
</head>
<body>
<main>
<div class="brand">أركانات للحراسات الأمنية</div>
<div id="subtitle" class="sub">نظام الرصد الميداني السريع</div>
<section class="card"><div id="app"></div></section>
</main>
<script>
const VERSION='FIELD-QR-V5.0-20260909';
const API='https://dbxvfrkkocfwjumvoaha.supabase.co/functions/v1/guard-control-uat-helper';
const BASE=location.origin+location.pathname;
const qs=new URLSearchParams(location.search);
let OPS=qs.get('ops')||null,TOKEN=qs.get('p')||qs.get('field')||null;
try{if(OPS)sessionStorage.setItem('arkanat_field_ops_v5',OPS);else OPS=sessionStorage.getItem('arkanat_field_ops_v5');if(TOKEN)sessionStorage.setItem('arkanat_field_token_v5',TOKEN);else TOKEN=sessionStorage.getItem('arkanat_field_token_v5');if((OPS||TOKEN)&&location.search)history.replaceState(null,'',BASE)}catch(_){ }
const app=document.getElementById('app');const QUEUE_KEY='arkanat_field_queue_v5',QUEUE_CRYPTO='arkanat_field_queue_crypto_v5',NEXT_RETRY='arkanat_field_retry_v5';
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]||c))}
function uid(){return crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(36).slice(2)}
function delay(ms){return new Promise(r=>setTimeout(r,ms))}
function deviceId(){try{let x=localStorage.getItem('arkanat_field_device_v4');if(!x){x=uid();localStorage.setItem('arkanat_field_device_v4',x)}return x}catch(_){return 'ephemeral-'+uid()}}
function b64(buf){return btoa(String.fromCharCode(...new Uint8Array(buf)))}
function unb64(s){const x=atob(s),a=new Uint8Array(x.length);for(let i=0;i<x.length;i++)a[i]=x.charCodeAt(i);return a}
async function queueCryptoKey(){let raw=null;try{raw=localStorage.getItem(QUEUE_CRYPTO)}catch(_){ }if(!raw){const a=crypto.getRandomValues(new Uint8Array(32));raw=b64(a);try{localStorage.setItem(QUEUE_CRYPTO,raw)}catch(_){throw new Error('تعذر تجهيز التخزين الآمن على الجهاز.')}}return crypto.subtle.importKey('raw',unb64(raw),{name:'AES-GCM'},false,['encrypt','decrypt'])}
async function seal(x){const key=await queueCryptoKey(),iv=crypto.getRandomValues(new Uint8Array(12)),pt=new TextEncoder().encode(JSON.stringify(x)),ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,pt);return {iv:b64(iv),data:b64(ct),at:Date.now()}}
async function openSeal(x){const key=await queueCryptoKey(),pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(x.iv)},key,unb64(x.data));return JSON.parse(new TextDecoder().decode(pt))}
function rawQueue(){try{const q=JSON.parse(localStorage.getItem(QUEUE_KEY)||'[]');return Array.isArray(q)?q:[]}catch(_){return []}}
function saveRawQueue(q){localStorage.setItem(QUEUE_KEY,JSON.stringify(q.slice(-200)))}
async function enqueueScan(payload){const q=rawQueue();if(q.length>=200)throw new Error('يوجد عدد كبير من المسحات المعلقة على هذا الجهاز. اتصل بالإنترنت لرفعها قبل تسجيل مسحات إضافية.');q.push(await seal(payload));saveRawQueue(q);return q.length}
function pendingCount(){return rawQueue().length}
function setNextRetry(sec){try{localStorage.setItem(NEXT_RETRY,String(Date.now()+Math.max(30,Math.min(Number(sec)||60,86400))*1000))}catch(_){}}
function canRetryNow(){try{return Date.now()>=Number(localStorage.getItem(NEXT_RETRY)||0)}catch(_){return true}}
async function post(body,timeoutMs=30000){const ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),timeoutMs);try{const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body),signal:ctl.signal,cache:'no-store'});const txt=await r.text();let z={};try{z=txt?JSON.parse(txt):{}}catch(_){const e=new Error('استجابة الخادم غير صالحة.');e.retryable=true;throw e}if(!r.ok||!z.ok){const e=new Error(z.message||'تعذر تنفيذ الطلب');e.status=r.status;e.retryable=r.status===429||r.status>=500;e.retryAfter=Number(r.headers.get('retry-after')||z.retry_after_seconds||0);e.body=z;throw e}return z}catch(e){if(e&&e.name==='AbortError'){const x=new Error('انتهت مهلة الاتصال.');x.retryable=true;throw x}if(e instanceof TypeError)e.retryable=true;throw e}finally{clearTimeout(tm)}}
async function flushQueue(){if(!navigator.onLine||!canRetryNow())return {sent:0,pending:pendingCount()};const q=rawQueue();if(!q.length)return {sent:0,pending:0};const part=q.slice(0,20),scans=[];for(const x of part){try{scans.push(await openSeal(x))}catch(_){scans.push(null)}}const valid=scans.filter(Boolean);if(!valid.length){saveRawQueue(q.slice(part.length));return flushQueue()}try{const z=await post({action:'scan_batch',scans:valid},45000),res=Array.isArray(z.results)?z.results:[];const keep=[];let sent=0,vi=0;for(let i=0;i<part.length;i++){if(!scans[i])continue;const r=res[vi++]||{ok:false,queue:true};if(r.ok||r.duplicate){sent++;continue}if(r.status===400){continue}keep.push(part[i]);if(r.retry_after_seconds)setNextRetry(r.retry_after_seconds)}saveRawQueue([...keep,...q.slice(part.length)]);return {sent,pending:pendingCount()}}catch(e){if(e.retryAfter)setNextRetry(e.retryAfter);else setNextRetry(60);return {sent:0,pending:q.length}}}
async function renderQrs(tokens,grid){if(window.__qrLibFailed||typeof QRCode==='undefined')throw new Error('تعذر تحميل محرك QR. حدّث الصفحة قبل الطباعة.');grid.innerHTML='';for(let i=0;i<tokens.length;i++){const x=tokens[i],d=document.createElement('div'),c=document.createElement('canvas');d.className='qr-card';d.appendChild(c);grid.appendChild(d);await QRCode.toCanvas(c,BASE+'?p='+encodeURIComponent(x.raw_token),{width:360,margin:2,errorCorrectionLevel:'M'});if(i%20===19)await delay(0)}}
function opsView(){document.getElementById('subtitle').textContent='إدارة العمليات — إنشاء دفعة QR للمشرف';const batchRequest=uid();app.innerHTML=`<h2>بيانات المشرف</h2><p class="sub">أدخل بيانات المشرف وعدد الرموز المطلوبة. ستظهر صفحة طباعة تحتوي على QR فقط.</p><form id="f" autocomplete="off"><label>اسم المشرف</label><input id="name" required maxlength="120" placeholder="الاسم الرباعي"><label>رقم هوية المشرف</label><input id="nid" inputmode="numeric" required maxlength="10" pattern="[12][0-9]{9}" placeholder="10 أرقام"><label>رقم الجوال</label><input id="phone" inputmode="tel" required maxlength="14" placeholder="05xxxxxxxx"><label>عدد أكواد QR</label><input id="count" type="number" inputmode="numeric" min="1" max="100" value="20" required><div class="actions"><button id="send" type="submit">إنشاء الأكواد</button></div></form><div id="state"></div><div id="printArea" class="hidden"><div class="qr-tools screen-only"><button onclick="window.print()">طباعة / حفظ PDF</button> <button class="soft" onclick="location.reload()">دفعة جديدة</button></div><div id="qrGrid" class="print-grid"></div></div><details class="screen-only"><summary>استبدال QR تالف أو مفقود إذا كان رمز CP معروفاً</summary><p class="sub">ينشئ بديلاً ويربطه بنفس المشرف والموقع المنطقي ويحيل الرمز القديم للتقاعد. إذا كان الرمز القديم غير معروف، أنشئ QR جديداً للمشرف؛ سيحاول النظام ربطه تلقائياً عند أول مسحة GPS دقيقة في نفس النقطة.</p><label>رمز QR القديم</label><input id="oldCode" placeholder="CP-000123" maxlength="20"><div class="actions"><button id="replaceBtn" type="button" class="danger">إنشاء بديل</button></div><div id="replaceState"></div></details>`;const f=document.getElementById('f'),state=document.getElementById('state');f.onsubmit=async e=>{e.preventDefault();const b=document.getElementById('send');b.disabled=true;b.textContent='جارٍ الإنشاء…';state.innerHTML='<div class="spin"></div>';try{const z=await post({action:'create_batch',ops_key:OPS,supervisor_name:document.getElementById('name').value.trim(),national_id:document.getElementById('nid').value.trim(),phone:document.getElementById('phone').value.trim(),qr_count:Number(document.getElementById('count').value),request_id:batchRequest},45000);if(!Array.isArray(z.qr_tokens)||z.qr_tokens.length!==Number(z.qr_count))throw new Error('لم تصل جميع رموز QR للطباعة. لم يتم إظهار صفحة الطباعة.');f.classList.add('hidden');state.innerHTML='<div class="center"><h2 class="ok">تم إنشاء '+esc(z.qr_count)+' رمز QR</h2><p class="sub">تم ربط الدفعة بالمشرف. الطباعة أدناه تحتوي على الأكواد فقط.</p></div>';await renderQrs(z.qr_tokens,document.getElementById('qrGrid'));document.getElementById('printArea').classList.remove('hidden')}catch(err){state.innerHTML='<p class="bad">'+esc(err.message||err)+'</p>';b.disabled=false;b.textContent='إعادة المحاولة'}};document.getElementById('replaceBtn').onclick=async()=>{const btn=document.getElementById('replaceBtn'),rs=document.getElementById('replaceState'),code=document.getElementById('oldCode').value.trim().toUpperCase();if(!/^CP-[0-9]{6}$/.test(code)){rs.innerHTML='<p class="bad">أدخل رمزاً بالشكل CP-000123.</p>';return}btn.disabled=true;rs.innerHTML='<div class="spin"></div>';try{const z=await post({action:'replace_qr',ops_key:OPS,old_public_code:code,reason:'lost_or_damaged'},30000);rs.innerHTML='<p class="ok">تم إنشاء البديل '+esc(z.new_code||'')+'. اطبع الرمز التالي فقط.</p><div id="replacementGrid" class="print-grid"></div>';await renderQrs([{raw_token:z.raw_token}],document.getElementById('replacementGrid'))}catch(e){rs.innerHTML='<p class="bad">'+esc(e.message||e)+'</p>';btn.disabled=false}}}
function scanView(){document.getElementById('subtitle').textContent='إثبات التواجد الميداني';const eventNonce=uid();app.innerHTML=`<h2>تسجيل التواجد</h2><p class="sub">أدخل رقم الهوية والجوال فقط. يجمع النظام وقت الخادم والموقع الجغرافي عند الإرسال.</p><div id="gps" class="note">جارٍ تجهيز الموقع…</div><form id="f" autocomplete="off"><label>رقم الهوية</label><input id="nid" inputmode="numeric" maxlength="10" pattern="[12][0-9]{9}" required placeholder="10 أرقام"><label>رقم الجوال</label><input id="phone" inputmode="tel" maxlength="14" required placeholder="05xxxxxxxx"><div class="actions"><button id="send" type="submit">إرسال وإثبات التواجد</button></div></form><div id="pending" class="pending"></div><div id="state"></div>`;let LOC=null,LS='loading';const gps=document.getElementById('gps'),pending=document.getElementById('pending');function showPending(){const n=pendingCount();pending.textContent=n?'يوجد '+n+' مسحة محفوظة على هذا الجهاز بانتظار المزامنة.':''}showPending();const geoReady=new Promise(resolve=>{if(!navigator.geolocation){LS='unsupported';gps.innerHTML='<b class="warn">الموقع غير مدعوم في هذا الجهاز.</b> سيتم تسجيل ذلك للمراجعة.';resolve()}else navigator.geolocation.getCurrentPosition(p=>{LOC=p.coords;LS='granted';gps.innerHTML='<b class="ok">تم تجهيز الموقع الجغرافي</b> · الدقة التقريبية '+Math.round(p.coords.accuracy||0)+' م';resolve()},e=>{LS=e.code===1?'denied':'unavailable';gps.innerHTML='<b class="warn">تعذر تجهيز الموقع.</b> يمكنك الإرسال وسيتم تسجيل الحالة للمراجعة.';resolve()},{enableHighAccuracy:true,timeout:18000,maximumAge:0})});const f=document.getElementById('f'),state=document.getElementById('state');f.onsubmit=async e=>{e.preventDefault();const b=document.getElementById('send');b.disabled=true;b.textContent='جارٍ الإرسال…';state.innerHTML='<div class="spin"></div>';if(LS==='loading')await Promise.race([geoReady,delay(8000)]);const c=LOC,payload={checkpoint_token:TOKEN,event_nonce:eventNonce,device_id:deviceId(),national_id:document.getElementById('nid').value.trim(),phone:document.getElementById('phone').value.trim(),client_ts:new Date().toISOString(),location_status:LS,timezone:Intl.DateTimeFormat().resolvedOptions().timeZone||'',locale:navigator.language||'',viewport:innerWidth+'x'+innerHeight,network_type:(navigator.connection&&navigator.connection.effectiveType)||'',lat:c&&c.latitude,lng:c&&c.longitude,accuracy_m:c&&c.accuracy,altitude_m:c&&c.altitude,heading_deg:c&&c.heading,speed_mps:c&&c.speed};try{const z=await post({action:'scan',...payload},35000);f.classList.add('hidden');gps.classList.add('hidden');if(z.duplicate){state.innerHTML='<div class="center"><div style="font-size:54px">✓</div><h2 class="ok">المسحة مسجلة مسبقاً</h2><p class="sub">لم يتم إنشاء تسجيل مكرر.</p></div>';return}state.innerHTML='<div class="center"><div style="font-size:54px">✓</div><h2 class="ok">تم تسجيل التواجد</h2><p><b>'+esc(z.server_time_local||'')+'</b></p>'+(z.guard_name?'<p>تمت مطابقة الموظف: '+esc(z.guard_name)+'</p>':'<p class="sub">تم حفظ البيانات للمطابقة.</p>')+(Number(z.risk_score||0)>0?'<p class="warn">تم تسجيل ملاحظة تحقق آلية للمراجعة.</p>':'')+'</div>'}catch(err){if(err.retryable){try{const n=await enqueueScan(payload);f.classList.add('hidden');gps.classList.add('hidden');state.innerHTML='<div class="center"><div style="font-size:54px">⌛</div><h2 class="warn">تم حفظ المسحة على الجهاز</h2><p class="sub">لا تحتاج لإعادة المسح. سترسل تلقائياً عند عودة الاتصال أو توفر السعة التشغيلية.</p><p class="sub">المسحات المعلقة: '+n+'</p></div>';if(err.retryAfter)setNextRetry(err.retryAfter);showPending()}catch(qe){state.innerHTML='<p class="bad">'+esc(qe.message||qe)+'</p>';b.disabled=false;b.textContent='إعادة الإرسال'}}else{state.innerHTML='<p class="bad">'+esc(err.message||err)+'</p>';b.disabled=false;b.textContent='إعادة الإرسال'}}};setTimeout(async()=>{await flushQueue();showPending()},1200);window.addEventListener('online',async()=>{await flushQueue();showPending()})}
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js',{scope:'./'}).catch(()=>{}))}
if(OPS)opsView();else if(TOKEN)scanView();else app.innerHTML='<h2>الرابط غير مكتمل</h2><p class="sub">استخدم رابط إدارة العمليات أو امسح رمز QR معتمد.</p>';
</script>
</body>
</html>
