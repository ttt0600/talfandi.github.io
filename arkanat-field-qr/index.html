<head>

<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline'; connect-src 'self' https://dbxvfrkkocfwjumvoaha.supabase.co; img-src 'self' data: blob:; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'">
<title>أركانات | الرصد الميداني QR</title>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js" onerror="(function(){var s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js';s.onerror=function(){window.__qrLibFailed=true};document.head.appendChild(s)})()"></script>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;color:#17241d;background:#f4f7f5}*{box-sizing:border-box}body{margin:0}main{max-width:660px;margin:auto;padding:26px 16px 44px}.brand{font-size:27px;font-weight:900;color:#173f31}.sub{color:#69776f;font-size:14px;line-height:1.7}.card{margin-top:18px;background:#fff;border:1px solid #dce6e0;border-radius:20px;padding:22px;box-shadow:0 8px 26px rgba(20,60,40,.06)}label{display:block;font-weight:800;margin:13px 0 6px}input{width:100%;padding:13px 14px;border:1px solid #cfdad4;border-radius:13px;font-size:17px;background:#fff}input:focus{outline:3px solid #dcefe5;border-color:#1d6b4a}button{border:0;border-radius:13px;background:#1d6b4a;color:#fff;padding:13px 17px;font-weight:800;font-size:16px;cursor:pointer}button:disabled{opacity:.55}.soft{background:#edf4f0;color:#194d37}.danger{background:#8d2f2f}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.note{background:#eef5f1;border-radius:13px;padding:12px 14px;margin:12px 0;line-height:1.7}.ok{color:#12633f}.warn{color:#9b5c00}.bad{color:#a22626}.spin{width:36px;height:36px;border:4px solid #dbe5df;border-top-color:#1d6b4a;border-radius:50%;margin:14px auto;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}.center{text-align:center}.print-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6mm}.qr-card{min-height:47mm;display:flex;align-items:center;justify-content:center;break-inside:avoid;background:#fff}.qr-card canvas,.qr-card img{width:42mm!important;height:42mm!important}.hidden{display:none!important}details{margin-top:20px;border-top:1px solid #e3ebe6;padding-top:15px}summary{font-weight:800;cursor:pointer}.pending{font-size:13px;color:#8b6300;margin-top:10px}.screen-only{display:block}
@media(max-width:600px){.print-grid{grid-template-columns:repeat(2,1fr);gap:10px}.qr-card canvas,.qr-card img{width:150px!important;height:150px!important}}
@page{size:A4 portrait;margin:8mm}
@media print{
html,body{width:210mm;margin:0!important;padding:0!important;background:#fff!important}
body *{visibility:hidden!important}
#printArea,#printArea *{visibility:visible!important}
#printArea{position:absolute!important;top:0!important;right:0!important;left:0!important;width:100%!important;margin:0!important;padding:0!important}
#printArea .screen-only{display:none!important}
.print-grid{display:block!important;width:100%!important;margin:0!important;padding:0!important}
.qr-card{display:flex!important;width:194mm!important;height:281mm!important;min-height:281mm!important;margin:0!important;padding:0!important;align-items:center!important;justify-content:center!important;overflow:hidden!important;page-break-inside:avoid!important;break-inside:avoid-page!important;page-break-after:always!important;break-after:page!important;background:#fff!important}
.qr-card:last-child{page-break-after:auto!important;break-after:auto!important}
.qr-card canvas,.qr-card img{width:175mm!important;height:175mm!important;max-width:175mm!important;max-height:175mm!important;object-fit:contain!important}
}
</style>
</head>
<body>
<main><div class="brand">أركانات للحراسات الأمنية</div><div id="subtitle" class="sub">نظام الرصد الميداني السريع</div><section class="card"><div id="app"></div></section></main>
<script>
const VERSION='FIELD-QR-V5.3-20260909';
const API='https://dbxvfrkkocfwjumvoaha.supabase.co/functions/v1/guard-control-uat-helper';
const BASE=location.origin+location.pathname;
const QKEY='arkanat_field_queue_v5',CKEY='arkanat_field_queue_crypto_v5',RKEY='arkanat_field_retry_v5';
const qs=new URLSearchParams(location.search);let OPS=qs.get('ops')||null,TOKEN=qs.get('p')||qs.get('field')||null;
try{if(OPS)sessionStorage.setItem('arkanat_field_ops_v5',OPS);else OPS=sessionStorage.getItem('arkanat_field_ops_v5');if(TOKEN)sessionStorage.setItem('arkanat_field_token_v5',TOKEN);else TOKEN=sessionStorage.getItem('arkanat_field_token_v5');if((OPS||TOKEN)&&location.search)history.replaceState(null,'',BASE)}catch(_){}
const app=document.getElementById('app');
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function uid(){return crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(36).slice(2)}
function delay(ms){return new Promise(r=>setTimeout(r,ms))}
function deviceId(){try{let x=localStorage.getItem('arkanat_field_device_v4');if(!x){x=uid();localStorage.setItem('arkanat_field_device_v4',x)}return x}catch(_){return'ephemeral-'+uid()}}
function b64(b){return btoa(String.fromCharCode(...new Uint8Array(b)))}
function unb64(s){const x=atob(s),a=new Uint8Array(x.length);for(let i=0;i<x.length;i++)a[i]=x.charCodeAt(i);return a}
async function queueKey(){let r=null;try{r=localStorage.getItem(CKEY)}catch(_){}if(!r){r=b64(crypto.getRandomValues(new Uint8Array(32)));localStorage.setItem(CKEY,r)}return crypto.subtle.importKey('raw',unb64(r),{name:'AES-GCM'},false,['encrypt','decrypt'])}
async function seal(v){const k=await queueKey(),iv=crypto.getRandomValues(new Uint8Array(12)),pt=new TextEncoder().encode(JSON.stringify(v)),ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},k,pt);return{iv:b64(iv),data:b64(ct),at:Date.now()}}
async function openSeal(v){const k=await queueKey(),pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(v.iv)},k,unb64(v.data));return JSON.parse(new TextDecoder().decode(pt))}
function queue(){try{const q=JSON.parse(localStorage.getItem(QKEY)||'[]');return Array.isArray(q)?q:[]}catch(_){return[]}}
function saveQueue(q){localStorage.setItem(QKEY,JSON.stringify(q.slice(-200)))}
async function enqueue(v){const q=queue();if(q.length>=200)throw new Error('وصل الجهاز إلى 200 مسحة معلقة. يلزم الاتصال بالإنترنت قبل تسجيل المزيد.');q.push(await seal(v));saveQueue(q);return q.length}
function pending(){return queue().length}
function setRetry(s){try{localStorage.setItem(RKEY,String(Date.now()+Math.max(30,Math.min(Number(s)||60,86400))*1000))}catch(_){}}
function retryNow(){try{return Date.now()>=Number(localStorage.getItem(RKEY)||0)}catch(_){return true}}
async function post(body,ms=30000){const c=new AbortController(),t=setTimeout(()=>c.abort(),ms);try{const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body),signal:c.signal,cache:'no-store'}),txt=await r.text();let z={};try{z=txt?JSON.parse(txt):{}}catch(_){const e=new Error('استجابة الخادم غير صالحة.');e.retryable=true;throw e}if(!r.ok||!z.ok){const e=new Error(z.message||'تعذر تنفيذ الطلب');e.status=r.status;e.retryable=r.status===429||r.status>=500;e.retryAfter=Number(r.headers.get('retry-after')||z.retry_after_seconds||0);throw e}return z}catch(e){if(e.name==='AbortError'){const x=new Error('انتهت مهلة الاتصال.');x.retryable=true;throw x}if(e instanceof TypeError)e.retryable=true;throw e}finally{clearTimeout(t)}}
async function flush(){if(!navigator.onLine||!retryNow())return;const q=queue();if(!q.length)return;const part=q.slice(0,20),scans=[];for(const x of part){try{scans.push(await openSeal(x))}catch(_){scans.push(null)}}const valid=scans.filter(Boolean);if(!valid.length){saveQueue(q.slice(part.length));return}try{const z=await post({action:'scan_batch',scans:valid},45000),res=Array.isArray(z.results)?z.results:[],keep=[];let j=0;for(let i=0;i<part.length;i++){if(!scans[i])continue;const r=res[j++]||{ok:false,queue:true};if(r.ok||r.duplicate)continue;if(r.status===400)continue;keep.push(part[i]);if(r.retry_after_seconds)setRetry(r.retry_after_seconds)}saveQueue([...keep,...q.slice(part.length)])}catch(e){setRetry(e.retryAfter||60)}}
async function waitQrEngine(){for(let i=0;i<40;i++){if(typeof QRCode==='function')return true;if(window.__qrLibFailed)break;await delay(100)}return typeof QRCode==='function'}
async function renderQrs(tokens,grid){if(!await waitQrEngine())throw new Error('تعذر تحميل محرك QR. تحقق من الاتصال ثم حدّث الصفحة.');grid.innerHTML='';for(let i=0;i<tokens.length;i++){const d=document.createElement('div');d.className='qr-card';grid.appendChild(d);new QRCode(d,{text:BASE+'?p='+encodeURIComponent(tokens[i].raw_token),width:1200,height:1200,correctLevel:QRCode.CorrectLevel.M});if(i%10===9)await delay(0)}}
function opsView(){document.getElementById('subtitle').textContent='إدارة العمليات — إنشاء دفعة QR للمشرف';const reqId=uid();app.innerHTML=`<h2>بيانات المشرف</h2><p class="sub">أدخل بيانات المشرف وعدد الرموز. نسخة الطباعة تحتوي على QR فقط.</p><form id="f" autocomplete="off"><label>اسم المشرف</label><input id="name" required maxlength="120" placeholder="الاسم الرباعي"><label>رقم هوية المشرف</label><input id="nid" inputmode="numeric" required maxlength="10" pattern="[12][0-9]{9}" placeholder="10 أرقام"><label>رقم الجوال</label><input id="phone" inputmode="tel" required maxlength="14" placeholder="05xxxxxxxx"><label>عدد أكواد QR</label><input id="count" type="number" min="1" max="100" value="20" required><div class="actions"><button id="send">إنشاء الأكواد</button></div></form><div id="state"></div><div id="printArea" class="hidden"><div class="actions screen-only"><button type="button" onclick="window.print()">طباعة / حفظ PDF</button><button type="button" class="soft" onclick="location.reload()">دفعة جديدة</button></div><div id="qrGrid" class="print-grid"></div></div><details class="screen-only"><summary>استبدال QR تالف أو مفقود</summary><p class="sub">إذا كان رمز CP القديم معروفاً، ينشئ النظام بديلاً بنفس المشرف والنقطة المنطقية ويوقف القديم.</p><label>رمز QR القديم</label><input id="oldCode" maxlength="20" placeholder="CP-000123"><div class="actions"><button id="replaceBtn" type="button" class="danger">إنشاء بديل</button></div><div id="replaceState"></div></details>`;
const f=document.getElementById('f'),state=document.getElementById('state');
f.onsubmit=async e=>{e.preventDefault();const b=document.getElementById('send');b.disabled=true;b.textContent='جارٍ الإنشاء…';state.innerHTML='<div class="spin"></div>';try{if(!await waitQrEngine())throw new Error('محرك QR غير جاهز. حدّث الصفحة ثم حاول مرة أخرى.');const z=await post({action:'create_batch',ops_key:OPS,supervisor_name:document.getElementById('name').value.trim(),national_id:document.getElementById('nid').value.trim(),phone:document.getElementById('phone').value.trim(),qr_count:Number(document.getElementById('count').value),request_id:reqId},45000);if(!Array.isArray(z.qr_tokens)||z.qr_tokens.length!==Number(z.qr_count))throw new Error('لم تصل جميع الأكواد؛ أوقفت الطباعة لمنع ملف ناقص.');await renderQrs(z.qr_tokens,document.getElementById('qrGrid'));f.classList.add('hidden');state.innerHTML='<div class="center"><h2 class="ok">تم إنشاء '+esc(z.qr_count)+' رمز QR</h2><p class="sub">رقم الدفعة: '+esc(z.batch_code||'')+'</p></div>';document.getElementById('printArea').classList.remove('hidden')}catch(e){state.innerHTML='<p class="bad">'+esc(e.message)+'</p>';b.disabled=false;b.textContent='إعادة المحاولة'}};
document.getElementById('replaceBtn').onclick=async()=>{const btn=document.getElementById('replaceBtn'),rs=document.getElementById('replaceState'),code=document.getElementById('oldCode').value.trim().toUpperCase();if(!/^CP-[0-9]{6}$/.test(code)){rs.innerHTML='<p class="bad">أدخل الرمز بالشكل CP-000123.</p>';return}btn.disabled=true;rs.innerHTML='<div class="spin"></div>';try{if(!await waitQrEngine())throw new Error('محرك QR غير جاهز. حدّث الصفحة ثم حاول مرة أخرى.');const z=await post({action:'replace_qr',ops_key:OPS,old_public_code:code,reason:'lost_or_damaged'},30000);document.getElementById('qrGrid').innerHTML='';await renderQrs([{raw_token:z.raw_token}],document.getElementById('qrGrid'));rs.innerHTML='<p class="ok">تم إنشاء البديل '+esc(z.new_code||'')+'. استخدم زر طباعة / حفظ PDF أعلاه.</p>';document.getElementById('printArea').classList.remove('hidden')}catch(e){rs.innerHTML='<p class="bad">'+esc(e.message)+'</p>';btn.disabled=false}}}
function scanView(){document.getElementById('subtitle').textContent='إثبات التواجد الميداني';const nonce=uid();app.innerHTML=`<h2>تسجيل التواجد</h2><p class="sub">أدخل رقم الهوية والجوال فقط. الموقع والوقت يجمعان آلياً.</p><div id="gps" class="note">جارٍ تجهيز الموقع…</div><form id="f" autocomplete="off"><label>رقم الهوية</label><input id="nid" inputmode="numeric" maxlength="10" pattern="[12][0-9]{9}" required placeholder="10 أرقام"><label>رقم الجوال</label><input id="phone" inputmode="tel" maxlength="14" required placeholder="05xxxxxxxx"><div class="actions"><button id="send">إرسال وإثبات التواجد</button></div></form><div id="pending" class="pending"></div><div id="state"></div>`;let loc=null,ls='loading';const gps=document.getElementById('gps'),pend=document.getElementById('pending');const show=()=>{const n=pending();pend.textContent=n?'يوجد '+n+' مسحة محفوظة بانتظار المزامنة.':''};show();const ready=new Promise(resolve=>{if(!navigator.geolocation){ls='unsupported';gps.innerHTML='<b class="warn">الموقع غير مدعوم.</b> سيتم تسجيل ذلك.';resolve()}else navigator.geolocation.getCurrentPosition(p=>{loc=p.coords;ls='granted';gps.innerHTML='<b class="ok">تم تجهيز الموقع</b> · الدقة '+Math.round(p.coords.accuracy||0)+' م';resolve()},e=>{ls=e&&e.code===1?'denied':'unavailable';gps.innerHTML='<b class="warn">تعذر تجهيز الموقع.</b> يمكنك الإرسال وسيظهر ذلك للمراجعة.';resolve()},{enableHighAccuracy:true,timeout:18000,maximumAge:0})});
const f=document.getElementById('f'),state=document.getElementById('state');f.onsubmit=async e=>{e.preventDefault();const b=document.getElementById('send');b.disabled=true;b.textContent='جارٍ الإرسال…';state.innerHTML='<div class="spin"></div>';if(ls==='loading')await Promise.race([ready,delay(8000)]);const c=loc,payload={checkpoint_token:TOKEN,event_nonce:nonce,device_id:deviceId(),national_id:document.getElementById('nid').value.trim(),phone:document.getElementById('phone').value.trim(),client_ts:new Date().toISOString(),location_status:ls,timezone:Intl.DateTimeFormat().resolvedOptions().timeZone||'',locale:navigator.language||'',viewport:innerWidth+'x'+innerHeight,network_type:(navigator.connection&&navigator.connection.effectiveType)||'',lat:c&&c.latitude,lng:c&&c.longitude,accuracy_m:c&&c.accuracy,altitude_m:c&&c.altitude,heading_deg:c&&c.heading,speed_mps:c&&c.speed};try{const z=await post({action:'scan',...payload},35000);f.classList.add('hidden');gps.classList.add('hidden');state.innerHTML='<div class="center"><div style="font-size:54px">✓</div><h2 class="ok">'+(z.duplicate?'المسحة مسجلة مسبقاً':'تم تسجيل التواجد')+'</h2>'+(z.server_time_local?'<p><b>'+esc(z.server_time_local)+'</b></p>':'')+(z.guard_name?'<p>تمت مطابقة الموظف: '+esc(z.guard_name)+'</p>':'<p class="sub">تم حفظ البيانات للمطابقة.</p>')+'</div>'}catch(e){if(e.retryable){try{const n=await enqueue(payload);if(e.retryAfter)setRetry(e.retryAfter);f.classList.add('hidden');gps.classList.add('hidden');state.innerHTML='<div class="center"><div style="font-size:54px">⌛</div><h2 class="warn">تم حفظ المسحة على الجهاز</h2><p class="sub">لا تعِد المسح. سترسل تلقائياً عند عودة الاتصال أو توفر السعة. المعلق: '+n+'</p></div>';show()}catch(qe){state.innerHTML='<p class="bad">'+esc(qe.message)+'</p>';b.disabled=false;b.textContent='إعادة الإرسال'}}else{state.innerHTML='<p class="bad">'+esc(e.message)+'</p>';b.disabled=false;b.textContent='إعادة الإرسال'}}};setTimeout(async()=>{await flush();show()},1200);window.addEventListener('online',async()=>{await flush();show()})}
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js',{scope:'./'}).catch(()=>{}));
if(OPS)opsView();else if(TOKEN)scanView();else app.innerHTML='<h2>الرابط غير مكتمل</h2><p class="sub">استخدم رابط العمليات أو امسح QR معتمداً.</p>';
</script>
</body>
